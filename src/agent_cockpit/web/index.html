<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d97757'/%3E%3Cpath d='M16 6l2.6 7.4L26 16l-7.4 2.6L16 26l-2.6-7.4L6 16l7.4-2.6z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light;
  --bg:#fafafa; --surface:#ffffff; --surface-2:#f7f7f6; --surface-3:#efefed; --border:#e8e8e6; --border-strong:#d6d6d3;
  --text:#0b0b0b; --text-2:#4b4b48; --muted:#8a8a85; --accent:#c96442; --accent-soft:#f8e7df;
  --s-run:#2a78d6; --s-think:#6250d6; --s-sub:#1a9e6f; --s-appr:#b57800; --s-wait:#d9652f; --s-idle:#0c8a0c; --s-err:#d03b3b; --s-end:#8a8a85;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100;
  --code-bg:#f6f6f4; --diff-add:#e6f4e6; --diff-del:#fbe6e6;
  --shadow:none; --shadow-pop:0 12px 40px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.06);
  --glow:0 0 0 1px rgba(181,120,0,.45),0 6px 24px rgba(181,120,0,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0a0a0a; --surface:#111111; --surface-2:#161616; --surface-3:#1d1d1d; --border:#222222; --border-strong:#303030;
    --text:#ededed; --text-2:#a3a3a3; --muted:#6f6f6f; --accent:#e08a68; --accent-soft:#2e1c15;
    --s-run:#3987e5; --s-think:#9085e9; --s-sub:#22b882; --s-appr:#fab219; --s-wait:#ec835a; --s-idle:#2fbf2f; --s-err:#e66767; --s-end:#6f6f6f;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
    --code-bg:#0d0d0d; --diff-add:#11281a; --diff-del:#331515;
    --shadow:none; --shadow-pop:0 16px 50px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);
    --glow:0 0 0 1px rgba(250,178,25,.45),0 6px 28px rgba(250,178,25,.10);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0a0a0a; --surface:#111111; --surface-2:#161616; --surface-3:#1d1d1d; --border:#222222; --border-strong:#303030;
  --text:#ededed; --text-2:#a3a3a3; --muted:#6f6f6f; --accent:#e08a68; --accent-soft:#2e1c15;
  --s-run:#3987e5; --s-think:#9085e9; --s-sub:#22b882; --s-appr:#fab219; --s-wait:#ec835a; --s-idle:#2fbf2f; --s-err:#e66767; --s-end:#6f6f6f;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
  --code-bg:#0d0d0d; --diff-add:#11281a; --diff-del:#331515;
  --shadow:none; --shadow-pop:0 16px 50px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);
  --glow:0 0 0 1px rgba(250,178,25,.45),0 6px 28px rgba(250,178,25,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 Geist,Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
code,pre,.mono{font-family:"Geist Mono","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.18s}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:12px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted)}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--s-err)}
.conn.on i{background:var(--s-idle);box-shadow:0 0 0 3px color-mix(in srgb,var(--s-idle) 22%,transparent)}
.kpis{display:flex;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.kpi{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:10px;align-items:end;padding:7px 14px;border-right:1px solid var(--border);min-width:max-content;position:relative}
.kpi:last-child{border-right:0}
.kpi b{font:600 17px/1.15 "Geist Mono",ui-monospace,monospace;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--muted);white-space:nowrap;grid-column:1}
.kpi .spk{grid-row:1/3;grid-column:2;width:54px;height:24px;align-self:center;overflow:visible}
.kpi .spk path{fill:none;stroke:var(--c1);stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.kpi .spk .area{fill:color-mix(in srgb,var(--c1) 14%,transparent);stroke:none}
.kpi .dl{font:500 10.5px "Geist Mono",monospace;margin-left:6px;color:var(--muted)}
.kpi .dl.up{color:var(--s-wait)} .kpi .dl.down{color:var(--s-idle)}
.kpi.hot{background:color-mix(in srgb,var(--s-appr) 9%,transparent)}
.kpi.hot b{color:var(--s-appr)}
.kpi.hot::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--s-appr)}
.callrate{display:flex;flex-direction:column;gap:3px;min-width:150px}
.callrate .pl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);white-space:nowrap}
.callrate .pl b{font:600 11px "Geist Mono",monospace;color:var(--text-2)}
.callrate .pb{display:flex;align-items:flex-end;gap:1px;height:22px}
.callrate .pb i{flex:1;min-height:1px;background:var(--c1);opacity:.85;border-radius:1px 1px 0 0}
.callrate .pb i.z{background:var(--border-strong);opacity:.6}
.kbdbtn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12.5px}
.kbdbtn:hover{color:var(--text);border-color:var(--border-strong)}
.kbdbtn kbd{font:500 11px "Geist Mono",monospace;padding:1px 5px;border:1px solid var(--border-strong);border-radius:5px;color:var(--text-2)}
.tools{display:flex;gap:6px}
.iconbtn{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text-2)}
.iconbtn:hover{border-color:var(--border-strong);color:var(--text)}
.iconbtn.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}

/* ---------- layout */
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:calc(100vh - 61px)}
aside{border-right:1px solid var(--border);padding:14px 12px 40px;position:sticky;top:61px;height:calc(100vh - 61px);overflow-y:auto}
main{padding:20px 24px 60px;min-width:0}
.search{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--muted);margin-bottom:10px}
.search input{border:0;outline:0;background:transparent;color:var(--text);font:inherit;width:100%}
.seg{display:flex;padding:3px;background:var(--surface-3);border-radius:9px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;padding:5px 8px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--border)}
.navitem{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:9px;border:0;background:transparent;text-align:left;font-weight:550;color:var(--text-2);margin-bottom:6px}
.navitem:hover{background:var(--surface-3)}
.navitem.on{background:var(--surface-3);color:var(--text)}
.hostgrp{margin-top:14px}
.hosthead{display:flex;align-items:center;gap:8px;padding:4px 6px 8px;font-size:12px;color:var(--text-2);font-weight:600}
.hosthead .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hosthead .dot{width:7px;height:7px;border-radius:50%;background:var(--s-end);flex:none}
.hosthead .dot.on{background:var(--s-idle)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:99px;font-size:10.5px;font-weight:600;letter-spacing:.02em;border:1px solid var(--border);color:var(--text-2);background:var(--surface-2);white-space:nowrap}
.badge.ssh{color:var(--s-think);border-color:color-mix(in srgb,var(--s-think) 40%,var(--border))}
.badge.local{color:var(--s-run);border-color:color-mix(in srgb,var(--s-run) 40%,var(--border))}
.badge.warn{color:var(--s-appr);border-color:color-mix(in srgb,var(--s-appr) 50%,var(--border))}
.scard{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:11px;padding:9px 10px;margin-bottom:4px;position:relative}
.scard:hover{background:var(--surface-3)}
.scard.on{background:var(--surface);border-color:var(--border)}
.scard .stx{font-size:11.5px;font-weight:550;color:var(--sc)}
.scard .mt{font:500 11px "Geist Mono",monospace;color:var(--muted)}
.scard .mt.warn{color:var(--s-appr)}
.scard .row1{display:flex;align-items:center;gap:8px}
.scard .proj{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.scard .ago{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.scard .act{font-size:12px;color:var(--text-2);margin:3px 0 0 16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scard .meta{display:flex;gap:6px;margin:5px 0 0 16px;flex-wrap:wrap}
.scard.dim{opacity:.62}
.empty-side{font-size:12.5px;color:var(--muted);padding:12px 8px}

/* ---------- status */
.sdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--sc);position:relative}
.sdot.pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--sc);opacity:0;animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.8}100%{transform:scale(1.6);opacity:0}}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:99px;font-size:12px;font-weight:600;color:var(--sc);background:color-mix(in srgb,var(--sc) 12%,transparent);border:1px solid color-mix(in srgb,var(--sc) 30%,transparent);white-space:nowrap}
.pill .svg{width:13px;height:13px}
.st-running{--sc:var(--s-run)} .st-thinking{--sc:var(--s-think)} .st-subagents{--sc:var(--s-sub)} .st-awaiting_approval{--sc:var(--s-appr)}
.st-waiting_input{--sc:var(--s-wait)} .st-idle{--sc:var(--s-idle)} .st-error{--sc:var(--s-err)} .st-ended{--sc:var(--s-end)} .st-quiet{--sc:var(--s-end)}

/* ---------- cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
.card-h{display:flex;align-items:center;gap:8px;padding:11px 16px;border-bottom:1px solid var(--border);font-weight:560;font-size:13px}
.card-h .svg{color:var(--muted)}
.card-h .sub{color:var(--muted);font-weight:500;font-size:12px;margin-left:auto}
.card-b{padding:14px 16px}
.section-title{font-size:11.5px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:24px 0 10px}

/* ---------- approvals */
.dock{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.appr{border:1px solid color-mix(in srgb,var(--s-appr) 55%,var(--border));box-shadow:var(--glow);border-radius:14px;background:var(--surface);overflow:hidden;animation:slidein .25s ease-out}
@keyframes slidein{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.appr-h{display:flex;align-items:center;gap:10px;padding:12px 16px;background:color-mix(in srgb,var(--s-appr) 9%,var(--surface))}
.appr-h .t{font-weight:650}
.appr-h .where{color:var(--text-2);font-size:12.5px}
.appr-h .timer{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.appr-bar{height:3px;background:var(--surface-3)}
.appr-bar i{display:block;height:100%;background:var(--s-appr);transition:width 1s linear}
.appr-b{padding:12px 16px}
.appr-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface-2)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);font-weight:600;font-size:13px}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.primary:hover{opacity:.9}
.btn.good{color:var(--s-idle);border-color:color-mix(in srgb,var(--s-idle) 45%,var(--border))}
.btn.bad{color:var(--s-err);border-color:color-mix(in srgb,var(--s-err) 45%,var(--border))}
.btn kbd{font:500 10.5px "Geist Mono","JetBrains Mono",monospace;padding:0 5px;border-radius:4px;border:1px solid currentColor;opacity:.6}
.reason{flex:1;min-width:180px;padding:8px 10px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font:inherit;font-size:13px}
.rule{font:12px "Geist Mono","JetBrains Mono",monospace;padding:2px 7px;border-radius:6px;background:var(--surface-3);color:var(--text-2)}
pre.code{margin:0;padding:12px 14px;border-radius:10px;background:var(--code-bg);border:1px solid var(--border);overflow:auto;max-height:340px;white-space:pre-wrap;word-break:break-word;line-height:1.55}
.diff{border:1px solid var(--border);border-radius:10px;overflow:auto;max-height:360px;background:var(--code-bg)}
.diff div{padding:0 12px;white-space:pre-wrap;word-break:break-word;font:12.5px/1.6 "Geist Mono","JetBrains Mono",monospace}
.diff .a{background:var(--diff-add)} .diff .d{background:var(--diff-del)}
.diff .a::before{content:"+ ";color:var(--s-idle)} .diff .d::before{content:"− ";color:var(--s-err)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-all}

/* ---------- session detail */
.sess-h{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px}
.sess-h h1{margin:0;font-size:24px;letter-spacing:-.025em;font-weight:680;line-height:1.2}
.sess-h .title{color:var(--text-2);margin-top:4px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;background:var(--surface);border:1px solid var(--border);font-size:12px;color:var(--text-2);max-width:100%}
.chip .svg{width:13px;height:13px;color:var(--muted)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-h .acts{margin-left:auto;display:flex;gap:6px}

.now{display:grid;grid-template-columns:auto 1fr;gap:20px;padding:20px;align-items:center;position:relative;overflow:hidden}
.now::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 160px at 0% 0%,color-mix(in srgb,var(--sc) 14%,transparent),transparent 70%);pointer-events:none}
.orb{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:var(--sc);background:color-mix(in srgb,var(--sc) 12%,transparent);border:1px solid color-mix(in srgb,var(--sc) 35%,transparent);position:relative}
.orb .svg{width:26px;height:26px}
.orb.live::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid transparent;border-top-color:var(--sc);animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.now .lbl{font-size:12px;font-weight:600;color:var(--sc);text-transform:uppercase;letter-spacing:.06em;display:flex;gap:10px;align-items:center}
.now .lbl .el{color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.now .detail{font-size:17px;font-weight:600;margin-top:3px;letter-spacing:-.01em;word-break:break-word}
.cur{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.cur .toolline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.bubble{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);font-size:13.5px;white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto}
.bubble .who{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.q-opt{display:block;padding:8px 12px;border:1px solid var(--border);border-radius:9px;margin-top:6px;background:var(--surface)}
.q-opt small{display:block;color:var(--muted)}

.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;margin-top:18px}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}

/* timeline */
.tl-filter{display:flex;gap:4px;margin-left:auto}
.tl-filter button{border:1px solid transparent;background:transparent;font-size:11.5px;padding:3px 8px;border-radius:6px;color:var(--muted);font-weight:500}
.tl-filter button.on{border-color:var(--border);background:var(--surface-2);color:var(--text)}
.tl{max-height:640px;overflow:auto;padding:6px 0}
.ev{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:7px 16px;position:relative}
.ev:hover{background:var(--surface-2)}
.ev .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--surface-3);color:var(--text-2)}
.ev .ic .svg{width:13px;height:13px}
.ev .ic.ok{color:var(--s-idle)} .ev .ic.bad{color:var(--s-err);background:color-mix(in srgb,var(--s-err) 12%,transparent)}
.ev .ic.prompt{color:var(--accent);background:var(--accent-soft)} .ev .ic.appr{color:var(--s-appr)} .ev .ic.sub{color:var(--s-sub)}
.ev .h{font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.ev .h .agent{font-weight:500;color:var(--s-sub);font-size:11.5px}
.ev .x{font-size:12.5px;color:var(--text-2);word-break:break-word;white-space:pre-wrap;max-height:84px;overflow:hidden}
.ev .x.mono{font-size:11.8px}
.ev .r{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .tm{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}

/* subagents */
.sa{padding:12px 16px;border-bottom:1px solid var(--border)}
.sa:last-child{border-bottom:0}
.sa .r1{display:flex;gap:8px;align-items:center}
.sa .ty{font:600 11.5px "Geist Mono","JetBrains Mono",monospace;color:var(--s-sub);background:color-mix(in srgb,var(--s-sub) 12%,transparent);padding:1px 7px;border-radius:6px}
.sa .ds{font-weight:600;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sa .ln{font-size:12px;color:var(--text-2);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sa .mt{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.sa details{margin-top:6px} .sa summary{font-size:12px;color:var(--muted);cursor:pointer}
.sa details p{font-size:12.5px;color:var(--text-2);white-space:pre-wrap;margin:6px 0 0}
.bar-run{height:2px;border-radius:2px;margin-top:8px;background:linear-gradient(90deg,transparent,var(--s-sub),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:sweep 1.4s ease-in-out infinite}
@keyframes sweep{0%{background-position:-50% 0}100%{background-position:150% 0}}

/* todos */
.todo{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:13px}
.todo .bx{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--border-strong);flex:none;margin-top:2px;display:grid;place-items:center}
.todo.completed .bx{background:var(--s-idle);border-color:var(--s-idle);color:#fff}
.todo.completed span{color:var(--muted);text-decoration:line-through}
.todo.in_progress .bx{border-color:var(--s-run);box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 8px var(--s-run)}
.todo.in_progress span{font-weight:600}

/* usage */
.hero-num{font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.hero-sub{font-size:12px;color:var(--muted)}
.stackbar{display:flex;height:12px;border-radius:4px;overflow:hidden;gap:2px;margin:14px 0 10px;background:var(--surface)}
.stackbar i{display:block;height:100%;min-width:2px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12px}
.legend div{display:flex;align-items:center;gap:7px;color:var(--text-2)}
.legend b{margin-left:auto;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.gauge{margin-top:16px}
.gauge .gl{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-bottom:6px}
.gauge .gt{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.gauge .gt i{display:block;height:100%;border-radius:4px;background:var(--gc,var(--s-run))}
table.mini{width:100%;border-collapse:collapse;font-size:12px;margin-top:14px}
table.mini th{text-align:left;color:var(--muted);font-weight:500;padding:4px 0;border-bottom:1px solid var(--border)}
table.mini td{padding:5px 0;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
table.mini td:not(:first-child),table.mini th:not(:first-child){text-align:right}
.spark{display:flex;align-items:flex-end;gap:2px;height:54px;margin-top:14px;position:relative}
.spark i{flex:1;background:var(--c1);border-radius:2px 2px 0 0;min-height:1px;position:relative}
.spark i:hover{background:var(--accent)}
.spark-l{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:4px}
.hbar{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;font-size:12px;padding:3px 0}
.hbar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.hbar .t{height:8px;border-radius:0 4px 4px 0;background:var(--surface-3)}
.hbar .t i{display:block;height:100%;background:var(--c1);border-radius:0 4px 4px 0}
.hbar b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:7px;opacity:0;transition:opacity .1s;white-space:nowrap}

/* overview */
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ocard{padding:16px;cursor:pointer;transition:transform .12s,border-color .12s;display:flex;flex-direction:column;gap:10px;text-align:left}
.ocard:hover{border-color:var(--border-strong);background:var(--surface-2)}
.ocard .r1{display:flex;align-items:center;gap:8px}
.ocard h3{margin:0;font-size:15px;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocard .d{font-size:12.5px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.ocard .f{display:flex;gap:12px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.hosts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.hcard{padding:14px 16px;display:flex;gap:12px;align-items:center}
.hcard .hi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface-3);color:var(--text-2)}
.hcard .hn{font-weight:650}
.hcard .hs{font-size:12px;color:var(--muted)}
.help{padding:18px 20px}
.help h3{margin:0 0 6px;font-size:15px}
.help p{margin:6px 0;color:var(--text-2);font-size:13px}
.help pre{margin:8px 0}
.welcome{text-align:center;padding:60px 20px;color:var(--text-2)}
.welcome h2{color:var(--text);letter-spacing:-.02em}
.muted{color:var(--muted)}
.toast{position:fixed;right:20px;bottom:20px;z-index:60;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-pop);animation:slidein .2s}
/* new rows slide in (morph only creates genuinely new nodes) */
.ev,.scard,.tnode,.tr-row{animation:enter .28s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
/* compact density */
body.compact{font-size:13px}
body.compact .card-b{padding:10px 12px} body.compact .card-h{padding:8px 12px}
body.compact .ev{padding:4px 12px} body.compact .scard{padding:6px 8px}
body.compact main{padding:14px 18px 40px} body.compact .now{padding:14px} body.compact .orb{width:48px;height:48px}
body.compact .grid2{gap:12px} body.compact .stack{gap:12px}

/* session tabs */
.stabs{display:flex;gap:4px;margin:18px 0 0;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.stabs button{flex:none}
.stabs button{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;padding:9px 14px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.stabs button:hover{color:var(--text)}
.stabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.stabs .cnt{font-size:11px;font-weight:600;padding:0 6px;border-radius:99px;background:var(--surface-3);color:var(--text-2)}
.stabs .live-dot{width:6px;height:6px;border-radius:50%;background:var(--s-sub);animation:breathe 1.6s ease-in-out infinite}
.tabpane{margin-top:18px}

/* board */
.bd-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bd-top h1{margin:0;font-size:22px;letter-spacing:-.025em;font-weight:650}
.bd-top .sp{flex:1}
.sel{height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:12.5px}
.goals{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.goal{flex:none;min-width:190px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left}
.goal.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.goal b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal .gm{display:flex;justify-content:space-between;font:500 11px "Geist Mono",monospace;color:var(--muted);margin:4px 0 6px}
.goal .gb{height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.goal .gb i{display:block;height:100%;background:var(--s-idle)}
.board{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;align-items:start;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;min-height:200px;display:flex;flex-direction:column}
.col.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,var(--surface-2))}
.col-h{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:12.5px;font-weight:600}
.col-h .n{font:500 11px "Geist Mono",monospace;color:var(--muted);padding:0 6px;border-radius:99px;background:var(--surface-3)}
.col-h i{width:8px;height:8px;border-radius:50%;background:var(--cc)}
.col-h .add{margin-left:auto;border:0;background:transparent;color:var(--muted);border-radius:6px;padding:2px 6px}
.col-h .add:hover{background:var(--surface-3);color:var(--text)}
.col-b{display:flex;flex-direction:column;gap:8px;padding:0 8px 10px;flex:1}
.col-empty{font-size:12px;color:var(--muted);text-align:center;padding:18px 6px;border:1px dashed var(--border);border-radius:9px}
.kc{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 11px;cursor:grab;position:relative}
.kc:hover{border-color:var(--border-strong)}
.kc.dragging{opacity:.4}
.kc.task{border-left:3px solid var(--accent)}
.kc .k1{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;line-height:1.3}
.kc .k1 span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kc .k2{font-size:12px;color:var(--text-2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc .k3{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:7px;font:500 11px "Geist Mono",monospace;color:var(--muted)}
.kc .k3 .w{color:var(--s-appr)} .kc .k3 .g{color:var(--accent)}
.kc .acts{position:absolute;top:6px;right:6px;display:none;gap:2px}
.kc:hover .acts,.kc:focus-within .acts{display:flex}
.kc .acts button{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:2px 5px;color:var(--text-2);font-size:11px}
.kc .acts button:hover{color:var(--text);border-color:var(--border-strong)}
.kc .acts .svg{width:12px;height:12px}
.prio{font:600 10px "Geist Mono",monospace;padding:0 5px;border-radius:4px;color:var(--pc);border:1px solid color-mix(in srgb,var(--pc) 50%,transparent)}
.modal{position:fixed;inset:0;z-index:85;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding-top:10vh}
.modal[hidden]{display:none}
.mbox{width:min(620px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;box-shadow:var(--shadow-pop);animation:pop .14s ease-out}
.mbox .mh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600}
.mbox .mb{padding:14px 16px;display:grid;gap:10px}
.mbox label{display:grid;gap:5px;font-size:12px;color:var(--muted)}
.mbox input,.mbox textarea,.mbox select{font:inherit;font-size:13.5px;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;width:100%}
.mbox textarea{min-height:120px;resize:vertical;font-family:"Geist Mono",monospace;font-size:12.5px}
.mbox .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbox .mf{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--border)}
.mbox .mf .sp{flex:1}

/* command palette */
.cmdk{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
.cmdk[hidden]{display:none}
.cmdk-box{width:min(640px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;box-shadow:var(--shadow-pop);overflow:hidden;animation:pop .14s ease-out}
@keyframes pop{from{transform:scale(.98);opacity:0}to{transform:none;opacity:1}}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);color:var(--muted)}
.cmdk-in input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:15px}
.cmdk-list{max-height:min(420px,56vh);overflow:auto;padding:6px}
.cmdk-g{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:10px 10px 4px}
.cmdk-it{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;color:var(--text);font-size:13.5px}
.cmdk-it .svg{color:var(--muted)}
.cmdk-it .h{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.cmdk-it.on{background:var(--surface-3)}
.cmdk-it.on .svg{color:var(--text)}
.cmdk-it mark{background:none;color:var(--accent);font-weight:600}
.cmdk-foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted)}
.cmdk-foot kbd{font:500 10.5px "Geist Mono",monospace;padding:0 4px;border:1px solid var(--border-strong);border-radius:4px}
.cmdk-empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}

/* trace waterfall */
.tr-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tr-nav{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.tr-nav button{border:0;background:transparent;padding:4px 9px;color:var(--text-2)}
.tr-nav button:disabled{opacity:.35;cursor:default}
.tr-nav span{font:500 12px "Geist Mono",monospace;padding:0 8px;color:var(--text);border-left:1px solid var(--border);border-right:1px solid var(--border);line-height:26px}
.tr-prompt{flex:1;min-width:200px;font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-stats{display:flex;gap:14px;font:500 11.5px "Geist Mono",monospace;color:var(--muted)}
.tr-stats b{color:var(--text);font-weight:600}
.tr-stats .bad b{color:var(--s-err)} .tr-stats .appr b{color:var(--s-appr)}
.tr{display:grid;grid-template-columns:minmax(220px,34%) 1fr;font-size:12px}
.tr-axis{display:contents}
.tr-axis .l{padding:6px 16px;color:var(--muted);font-size:11px;border-bottom:1px solid var(--border)}
.tr-axis .r{position:relative;height:28px;border-bottom:1px solid var(--border);margin-right:16px}
.tr-axis .r span{position:absolute;top:7px;transform:translateX(-50%);font:500 10.5px "Geist Mono",monospace;color:var(--muted);white-space:nowrap}
.tr-axis .r span:first-child{transform:none} .tr-axis .r span:last-child{transform:translateX(-100%)}
.tr-body{display:contents}
.tr-row{display:contents;cursor:pointer}
.tr-row>div{border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent);height:27px}
.tr-row:hover>div,.tr-row.sel>div{background:var(--surface-2)}
.tr-row.sel>div{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.tr-row .l{display:flex;align-items:center;gap:6px;padding:0 10px 0 16px;min-width:0;white-space:nowrap}
.tr-row .l .svg{width:13px;height:13px;color:var(--muted)}
.tr-row .l b{font-weight:560}
.tr-row .l em{font-style:normal;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.tr-row .l .tw{color:var(--border-strong);font-family:"Geist Mono",monospace}
.tr-row .r{position:relative;margin-right:16px;background-image:linear-gradient(to right,color-mix(in srgb,var(--border) 70%,transparent) 1px,transparent 1px);background-size:25% 100%}
.tr-bar{position:absolute;top:7px;height:13px;border-radius:3px;min-width:3px;background:var(--bc)}
.tr-bar.sub{background:color-mix(in srgb,var(--bc) 22%,transparent);border:1px solid color-mix(in srgb,var(--bc) 70%,transparent)}
.tr-bar.appr{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--s-appr) 70%,transparent) 0 4px,color-mix(in srgb,var(--s-appr) 30%,transparent) 4px 8px)}
.tr-bar.run{background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);background-size:40px 100%;background-repeat:no-repeat;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{from{background-position:-40px 0}to{background-position:calc(100% + 40px) 0}}
.tr-bar.fail{--bc:var(--s-err)}
.tr-lab{position:absolute;top:6px;font:500 10.5px "Geist Mono",monospace;color:var(--muted);white-space:nowrap;padding-left:6px}
.tr-mark{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--muted)}
.tr-detail{border-top:1px solid var(--border);padding:14px 16px;display:grid;grid-template-columns:repeat(4,auto) 1fr;gap:4px 22px;align-items:baseline}
.tr-detail .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tr-detail .v{font:500 12.5px "Geist Mono",monospace}
.tr-detail pre{grid-column:1/-1;margin:8px 0 0}
.tr-legend{display:flex;flex-wrap:wrap;gap:14px;padding:10px 16px;font-size:11.5px;color:var(--text-2);border-top:1px solid var(--border)}
.tr-legend span{display:inline-flex;align-items:center;gap:6px}
.tr-legend i{display:inline-block;width:16px;height:9px;border-radius:2px}

/* agent tree */
.tree-wrap{overflow:auto;padding:18px}
.tree{position:relative}
.tree svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.tree svg.edges path{fill:none;stroke:var(--border-strong);stroke-width:1.5}
.tree svg.edges path.flow{stroke:var(--s-sub);stroke-width:2;stroke-dasharray:6 6;animation:dash 1s linear infinite}
.tree svg.edges path.flow-run{stroke:var(--s-run);stroke-width:2;stroke-dasharray:6 6;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gc) 35%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--gc) 0%,transparent)}}
.tnode{position:absolute;width:214px;height:50px;border-radius:11px;border:1px solid var(--border);background:var(--surface);padding:6px 11px;display:flex;flex-direction:column;justify-content:center;gap:2px;font-size:12px;text-align:left;box-shadow:var(--shadow)}
.tnode .t1{display:flex;gap:6px;align-items:center;font-weight:600;white-space:nowrap;overflow:hidden;min-width:0}
.tnode .t1 .lbl{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tnode .t1 .n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--text-2);font-weight:600}
.tnode .t2{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnode .svg{width:14px;height:14px;color:var(--text-2)}
.tnode.session{border-color:color-mix(in srgb,var(--accent) 55%,var(--border));background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.tnode.session .svg{color:var(--accent)}
.tnode.agent{cursor:pointer;border-color:color-mix(in srgb,var(--s-sub) 40%,var(--border))}
.tnode.agent .ty{font:600 10.5px "Geist Mono","JetBrains Mono",monospace;color:var(--s-sub);background:color-mix(in srgb,var(--s-sub) 12%,transparent);padding:0 6px;border-radius:5px;flex:none}
.tnode.agent.running{--gc:var(--s-sub);animation:glow 2s ease-in-out infinite}
.tnode.agent.sel{outline:2px solid var(--s-sub);outline-offset:2px}
.tnode.agent.failed{border-color:color-mix(in srgb,var(--s-err) 55%,var(--border))}
.tnode.tool{background:var(--surface-2);box-shadow:none}
.tnode.tool.live{--gc:var(--s-run);border-color:var(--s-run);animation:glow 1.6s ease-in-out infinite}
.tnode.tool.live .svg{color:var(--s-run)}
.tnode.more{border-style:dashed;background:transparent;box-shadow:none}
.tree-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--text-2);padding:0 18px 14px}
.tree-legend span{display:inline-flex;align-items:center;gap:6px}
.tree-legend i{width:18px;height:0;border-top:2px dashed var(--s-sub)}
.tree-legend i.solid{border-top:1.5px solid var(--border-strong)}
.tree-legend i.run{border-top-color:var(--s-run)}

/* hot files */
.tm{position:relative;width:100%;aspect-ratio:1000/470;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.tm .grp{position:absolute;border-radius:8px;background:var(--surface-3)}
.tm .grp .gh{position:absolute;left:8px;right:8px;top:3px;font-size:11px;font-weight:600;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .fc{position:absolute;border-radius:6px;padding:5px 7px;overflow:hidden;cursor:pointer;background:color-mix(in srgb,var(--fc) 20%,var(--surface));border:1px solid color-mix(in srgb,var(--fc) 55%,transparent);transition:filter .12s}
.tm .fc:hover{filter:brightness(1.12);z-index:2}
.tm .fc b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.tm .fc span{display:block;font-size:10.5px;color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums}

<body>
<header class="top">
  <div class="brand"><div class="logo"><svg class="svg" viewBox="0 0 24 24" style="stroke-width:2.2"><path d="M12 3l2 6.5L20.5 12 14 14l-2 7-2-7-6.5-2L10 9.5z"/></svg></div>Agent Cockpit
    <span class="conn" id="conn"><i></i><span>connecting</span></span></div>

  <div class="callrate" id="pulse" title="Tool calls per minute across every session and machine, last hour"></div>
  <div class="tools">

</div>

  <div class="cmdk-in"><svg class="svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="cmdkq" placeholder="Search sessions, jump anywhere, approve…" autocomplete="off" spellcheck="false"></div>

</div></div>
<script>
const TOKEN = "__COCKPIT_TOKEN__";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S = { sessions:new Map(), hosts:new Map(), approvals:new Map(), sel:null, page:"overview", filter:"active", q:"", tl:"all", connected:false, skew:0,
  account:null, limits:{}, limitHist:{}, acctMetric:"cost", acctRange:30,
  stab:"activity", treeSel:null, fileScope:"session", projFiles:{},
  board:{cards:{}, overrides:{}}, boardGoal:null, boardHost:"", boardSpan:"48h" };
const prefs = (()=>{ try{ return JSON.parse(localStorage.getItem("cockpit")||"{}") }catch{ return {} } })();
const savePrefs = ()=>{ try{ localStorage.setItem("cockpit", JSON.stringify(prefs)) }catch{} };

/* ------------------------------------------------------------- icons */
const P = {
  terminal:'<path d="M4 17l6-5-6-5"/><path d="M12 19h8"/>', file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>', search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>', bot:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 14h.01M15 14h.01"/>',
  check:'<path d="M5 12l5 5L20 7"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>', server:'<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>',
  laptop:'<rect x="4" y="5" width="16" height="11" rx="2"/><path d="M2 19h20"/>', zap:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>', list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
  brain:'<path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a3 3 0 0 0-3-1zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', msg:'<path d="M21 12a8 8 0 0 1-12 7l-5 1 1-4a8 8 0 1 1 16-4z"/>', pause:'<circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/>',
  stop:'<circle cx="12" cy="12" r="9"/><rect x="9" y="9" width="6" height="6" rx="1"/>', alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17h.01"/>', play:'<path d="M7 4l13 8-13 8z"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>', branch:'<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 4-6 3-12 7"/>',
  cpu:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>', hash:'<path d="M5 9h14M5 15h14M10 3L8 21M16 3l-2 18"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/>', belloff:'<path d="M6 8a6 6 0 0 1 9.3-5M18 8c0 7 3 9 3 9H9M10 21a2 2 0 0 0 4 0M3 3l18 18"/>',
  vol:'<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>', mute:'<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>', moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  link:'<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>', trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  compress:'<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>', sparkle:'<path d="M12 3l2 6.5L20.5 12 14 14l-2 7-2-7-6.5-2L10 9.5z"/>',
};
const ic = (n, extra="") => `<svg class="svg" viewBox="0 0 24 24" ${extra}>${P[n]||P.zap}</svg>`;
const toolIcon = t => !t ? "zap" : t==="Bash"?"terminal": ["Read"].includes(t)?"file": ["Edit","Write","MultiEdit","NotebookEdit"].includes(t)?"edit":
  ["Grep","Glob"].includes(t)?"search": ["WebFetch","WebSearch"].includes(t)?"globe": ["Task","Agent"].includes(t)?"bot": t==="TodoWrite"?"list": t==="AskUserQuestion"?"msg": t.startsWith("mcp__")?"link":"zap";
const toolName = t => t && t.startsWith("mcp__") ? t.slice(5).replace("__"," › ") : t;

/* ------------------------------------------------------------- status */
const STATUS = {
  running:{l:"Running",i:"play",live:true}, thinking:{l:"Thinking",i:"brain",live:true}, subagents:{l:"Subagents working",i:"bot",live:true},
  awaiting_approval:{l:"Needs approval",i:"shield",live:false}, waiting_input:{l:"Waiting for you",i:"msg",live:false},
  idle:{l:"Idle",i:"check",live:false}, error:{l:"Error",i:"alert",live:false}, ended:{l:"Ended",i:"stop",live:false}, quiet:{l:"Quiet",i:"pause",live:false},
};
const now = () => Date.now()/1000 + S.skew;
function effStatus(s){
  if (s.pending && s.pending.length) return "awaiting_approval";
  if (["running","thinking","subagents"].includes(s.status) && now()-s.last_ts > 900) return "quiet";
  return s.status;
}
const isActive = s => { const st=effStatus(s); return st!=="ended" && (now()-s.last_ts < 6*3600 || st==="awaiting_approval"); };
const pill = (st, sm) => { const m=STATUS[st]||STATUS.idle; return `<span class="pill st-${st}">${ic(m.i)}${esc(m.l)}</span>`; };
const sdot = st => `<span class="sdot st-${st} ${STATUS[st]?.live||st==="awaiting_approval"?"pulse":""}"></span>`;

/* ------------------------------------------------------------- format */
const fmtN = n => { n=+n||0; return n>=1e9?(n/1e9).toFixed(2)+"B": n>=1e6?(n/1e6).toFixed(n>=1e7?1:2)+"M": n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+"k": String(n); };
function ago(t){ const d=Math.max(0,now()-t); return d<5?"now": d<60?Math.floor(d)+"s": d<3600?Math.floor(d/60)+"m": d<86400?Math.floor(d/3600)+"h": Math.floor(d/86400)+"d"; }
function dur(d){ d=Math.max(0,Math.floor(d)); if (d>=86400) return `${Math.floor(d/86400)}d ${Math.floor(d%86400/3600)}h`; const h=Math.floor(d/3600), m=Math.floor(d%3600/60), s=d%60; return h? `${h}h ${m}m` : m? `${m}m ${String(s).padStart(2,"0")}s` : `${s}s`; }
const clock = t => new Date(t*1000).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
const tot = u => (u.in||0)+(u.out||0)+(u.cr||0)+(u.cw||0);
const shortModel = m => (m||"").replace(/^claude-/,"").replace(/-\d{8}$/,"");
const homeTilde = p => (p||"").replace(/^\/(Users|home)\/[^/]+/,"~");
const hostOf = s => S.hosts.get(s.host) || {hostname:(s.host||"?").split("@")[1]||s.host, user:""};
const ctxWindow = s => /1m|\[1m\]/i.test(s.model||"") || (s.usage?.ctx||0) > 200000 ? 1000000 : 200000;

/* ------------------------------------------------------------- data */
async function api(path, opts={}){
  const r = await fetch(path, {...opts, headers:{"Content-Type":"application/json","X-Cockpit-Token":TOKEN, ...(opts.headers||{})}});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function loadState(){
  const d = await api("/api/state");
  S.skew = d.server.time - Date.now()/1000;
  S.sessions = new Map(d.sessions.map(s=>[s.id,s]));
  S.hosts = new Map(d.hosts.map(h=>[h.key,h]));
  S.approvals = new Map(d.approvals.map(a=>[a.id,a]));
  S.account = d.account; S.limits = d.limits||{}; S.limitHist = d.limit_hist||{}; S.board = d.board || S.board;
  if (!S.sel && location.hash==="#account") S.page="account";
  else if (!S.sel && location.hash==="#board") S.page="board";
  else if (!S.sel && location.hash.length>1) S.sel = decodeURIComponent(location.hash.slice(1));
  if (S.sel && !S.sessions.has(S.sel)) S.sel = null;
  render();
}
let es;
function connect(){
  es = new EventSource("/api/stream?t="+encodeURIComponent(TOKEN));
  es.onopen = () => { S.connected = true; loadState().catch(()=>{}); renderConn(); };
  es.onerror = () => { S.connected = false; renderConn(); };
  es.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type==="session"){
      const old = S.sessions.get(m.session.id);
      const events = old?.events || [];
      if (m.event){ events.push(m.event); if (events.length>600) events.splice(0, events.length-600); }
      S.sessions.set(m.session.id, {...m.session, events});
    } else if (m.type==="host"){ S.hosts.set(m.host.key, m.host); }
    else if (m.type==="approval"){
      const isNew = !S.approvals.has(m.approval.id) && m.approval.status==="pending";
      S.approvals.set(m.approval.id, m.approval);
      if (isNew) alertApproval(m.approval);
    } else if (m.type==="account"){ S.account = m.account; }
    else if (m.type==="board"){ S.board = m.board; }
    else if (m.type==="limits"){ S.limits[m.host] = m.limits; S.limitHist[m.host] = m.hist; }
    else if (m.type==="remove"){ S.sessions.delete(m.id); if (S.sel===m.id) S.sel=null; }
    schedule();
  };
}
let raf=0; function schedule(){ if(!raf) raf=requestAnimationFrame(()=>{raf=0;render();}); }

/* ------------------------------------------------------------- alerts */
function alertApproval(a){
  const s = S.sessions.get(a.session);
  if (prefs.sound!==false) beep();
  if (prefs.notify && "Notification" in window && Notification.permission==="granted"){
    const n = new Notification(`Approval needed · ${a.tool}`, {body:`${hostOf(s||{}).hostname||""} · ${a.project}\n${a.summary||""}`.slice(0,240), tag:a.id, requireInteraction:true});
    n.onclick = () => { window.focus(); S.sel=a.session; render(); n.close(); };
  }
}
let actx; function beep(){ try{ actx = actx || new AudioContext(); const t=actx.currentTime;
  [[880,0],[1175,.12]].forEach(([f,d])=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; o.type="sine";
  g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(.12,t+d+.02); g.gain.exponentialRampToValueAtTime(.001,t+d+.22); o.connect(g).connect(actx.destination); o.start(t+d); o.stop(t+d+.25); }); }catch{} }
function toast(msg){ const d=document.createElement("div"); d.className="toast"; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }

/* ------------------------------------------------------------- morph: patch the DOM instead of replacing it */
// Keeps running CSS animations, scroll positions, focus and typed input intact; only changed nodes are touched.
// Elements with data-key are matched by key, so list items move instead of being recreated (new ones animate in).
const _tpl = document.createElement("template");
function morph(el, html){ _tpl.innerHTML = html; patchKids(el, _tpl.content); }
function sameNode(a,b){ return a.nodeType===b.nodeType && (a.nodeType!==1 || a.tagName===b.tagName); }
function patchKids(parent, src){
  const byKey = new Map();
  for (const c of parent.childNodes) if (c.nodeType===1 && c.dataset.key) byKey.set(c.dataset.key, c);
  let cur = parent.firstChild;
  for (const n of [...src.childNodes]){
    const key = n.nodeType===1 ? n.getAttribute("data-key") : null;
    let m = null;
    if (key){ m = byKey.get(key); if (m && !sameNode(m,n)) m = null; byKey.delete(key); }
    else if (cur && sameNode(cur,n) && !(cur.nodeType===1 && cur.dataset.key)) m = cur;
    if (m){ if (m!==cur) parent.insertBefore(m, cur); else cur = cur.nextSibling; patchNode(m, n); }
    else parent.insertBefore(n, cur);
  }
  while (cur){ const nx = cur.nextSibling; cur.remove(); cur = nx; }
}
function patchNode(o, n){
  if (o.nodeType===3 || o.nodeType===8){ if (o.nodeValue!==n.nodeValue) o.nodeValue = n.nodeValue; return; }
  const keep = o.tagName==="DETAILS" ? ["open"] : [];
  for (const a of [...o.attributes]) if (!n.hasAttribute(a.name) && !keep.includes(a.name)) o.removeAttribute(a.name);
  for (const a of n.attributes) if (o.getAttribute(a.name)!==a.value) o.setAttribute(a.name, a.value);
  if (o.tagName==="INPUT" || o.tagName==="TEXTAREA") return;
  if (o.hasAttribute("data-live")) return; // contents managed by timers (elapsed clocks)
  patchKids(o, n);
}
// smooth page switches where the browser supports it
function go(fn){ if (document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) document.startViewTransition(()=>{ fn(); render(); }); else { fn(); render(); } }

/* ------------------------------------------------------------- render */
let lastSig = {};
function render(){
  renderConn(); renderKpis(); renderSide(); renderDock(); renderView(); renderTools();
  const n = pendingApprovals().length;
  document.title = (n? `(${n}) ` : "") + "Agent Cockpit";
}
function renderConn(){ const c=$("#conn"); c.className="conn"+(S.connected?" on":""); c.lastElementChild.textContent = S.connected?"live":"offline"; }
const pendingApprovals = () => [...S.approvals.values()].filter(a=>a.status==="pending").sort((a,b)=>a.created-b.created);

/* ---------- sparklines + count-up */
function spark(vals, opts={}){
  if (!vals || vals.length<2 || vals.every(v=>!v)) return "";
  const W=54, H=24, mx = opts.max ?? Math.max(...vals), mn = opts.min ?? 0, rng = (mx-mn)||1;
  const pts = vals.map((v,i)=>[i*W/(vals.length-1), H-1-((v-mn)/rng)*(H-3)]);
  const d = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return `<svg class="spk" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path class="area" d="${d} L${W} ${H} L0 ${H} Z"/><path d="${d}"/></svg>`;
}
const FMT = { int:v=>String(Math.round(v)), pct:v=>Math.round(v)+"%", money:v=>money(v), n:v=>fmtN(Math.round(v)) };
function countUp(root){
  root.querySelectorAll("[data-num]").forEach(el=>{
    const to=+el.dataset.num, fmt=FMT[el.dataset.fmt]||FMT.int, from = el._v ?? to;
    el._v = to;
    if (from===to || matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent = fmt(to); return; }
    const t0=performance.now(), D=450;
    const step=t=>{ const k=Math.min(1,(t-t0)/D), e=1-Math.pow(1-k,3); el.textContent = fmt(from+(to-from)*e); if(k<1 && el._v===to) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
const dayKeyOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function dailySeries(field, days){
  const A=S.account?.daily||{}, out=[], t=new Date(now()*1000);
  for (let i=days-1;i>=0;i--){ const d=new Date(t.getTime()-i*864e5); out.push((A[dayKeyOf(d)]||{})[field]||0); }
  return out;
}
function limitSeries(idx, windowSec, n){
  const lim=primaryLimits(); if(!lim) return [];
  const h=(S.limitHist[lim.host]||[]).filter(x=>x[idx]!=null && x[0]>=now()-windowSec);
  if (h.length<2) return [];
  const out=[]; let j=0, last=h[0][idx];
  for (let i=0;i<n;i++){ const t=now()-windowSec+(i+1)*windowSec/n; while(j<h.length && h[j][0]<=t){ last=h[j][idx]; j++; } out.push(last); }
  return out;
}
function delta(cur, base){
  if (!base) return "";
  const p = (cur-base)/base*100; if (Math.abs(p)<1) return `<span class="dl">±0%</span>`;
  return `<span class="dl ${p>0?"up":"down"}">${p>0?"↑":"↓"}${Math.abs(p).toFixed(0)}%</span>`;
}

function ruleText(sug){

  }
  return out;

/* ---------- board */
const COLS = [["backlog","Backlog","var(--muted)"],["running","Running","var(--s-run)"],["needs","Needs you","var(--s-appr)"],["review","Review","var(--s-think)"],["done","Done","var(--s-idle)"]];
const PRIO = [null,["P3","var(--muted)"],["P2","var(--s-run)"],["P1","var(--s-err)"]];
function lastPromptT(s){ const e=(s.events||[]).filter(x=>x.kind==="UserPromptSubmit").pop(); return e?e.t:(s.started||0); }
function changedFiles(s, since){ return Object.values(s.files||{}).filter(f=>(f.e||f.w) && f.last>=since).length; }
function sessionCol(s){
  const ov = S.board.overrides?.[s.id];
  if (ov && ov.turns===s.turns) return ov.col;
  const st = effStatus(s);
  if (["awaiting_approval","waiting_input","error"].includes(st)) return "needs";
  if (["running","thinking","subagents"].includes(st)) return "running";
  // closed sessions only stay in Review for a few hours; after that they're history, not a to-do
  if (st==="ended" && now()-s.last_ts > 6*3600) return "done";
  return changedFiles(s, lastPromptT(s)) ? "review" : "done";
}
const sessionCost = s => s.cost_usd ?? s.usage?.cost ?? 0;
function boardItems(){
  const cards = Object.values(S.board.cards||{});
  const linked = new Set(cards.map(c=>c.session).filter(Boolean));
  const span = {"48h":48*3600,"7d":7*86400,"all":1e12}[S.boardSpan];
  const items = [];
  for (const c of cards){
    const s = c.session && S.sessions.get(c.session);
    const col = c.col==="done" ? "done" : s ? (c.col==="backlog" && sessionCol(s)==="done" && !changedFiles(s,0) ? "backlog" : sessionCol(s)) : c.col;
    items.push({kind:"task", c, s, col, t: s ? s.last_ts : (c.moved||c.updated||c.created), goal:c.goal||""});
  }
  for (const s of S.sessions.values()){
    if (linked.has(s.id)) continue;
    const col = sessionCol(s);
    if (now()-s.last_ts > span && col!=="needs") continue;
    items.push({kind:"session", s, col, t:s.last_ts, goal:""});
  }
  return items.filter(x=>(!S.boardGoal || x.goal===S.boardGoal) && (!S.boardHost || (x.s && x.s.host===S.boardHost)));
}
function boardCounts(){ const n={}; for (const [k] of COLS) n[k]=0; for (const x of boardItems()) n[x.col]++; return n; }

/* ---------- prompts: make harness-injected messages readable */
function cleanPrompt(p){
  p = String(p||"");
  if (p.startsWith("<task-notification>")){
    const g = k => (p.match(new RegExp(`<${k}>([\\s\\S]*?)</${k}>`))||[])[1]||"";
    const st = g("status"), sum = g("summary").trim();
    return `⚙ Background task ${st||"update"}${sum?` — ${sum}`:""}`;
  }
  if (/^<(bash-input|bash-stdout|command-name|local-command)/.test(p)){
    const cmd = (p.match(/<bash-input>([\s\S]*?)<\/bash-input>/)||p.match(/<command-name>([\s\S]*?)<\/command-name>/)||[])[1];
    return cmd ? `$ ${cmd.trim()}` : p.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
  }
  return p;
}

function fuzzy(q, text){
  if (!q) return {score:0, html:esc(text)};
  const t=text.toLowerCase(), qq=q.toLowerCase(); let idx=t.indexOf(qq);
  if (idx>=0) return {score:1000-idx-(text.length/100), html:esc(text.slice(0,idx))+"<mark>"+esc(text.slice(idx,idx+q.length))+"</mark>"+esc(text.slice(idx+q.length))};
  // subsequence match, but only when the matched letters sit close together (no "t…r…c" across a whole sentence)
  let j=0, score=0, last=-2, first=-1, html="";
  for (let i=0;i<text.length;i++){ if (j<qq.length && t[i]===qq[j]){ if(first<0) first=i; score += (i===last+1?6:1) + (i===0||" -_/·".includes(t[i-1])?4:0); last=i; j++; html+="<mark>"+esc(text[i])+"</mark>"; } else html+=esc(text[i]); }
  if (j<qq.length || (last-first) > Math.max(6, qq.length*3)) return null;
  return {score, html};
}
function renderCmdk(){

    if (!lm && !hm) continue;
    res.push({...x, score: lm ? lm.score : 1, html: lm ? lm.html : esc(x.label)}); }
  if (q) res.sort((a,b)=>b.score-a.score);
  CK.shown = res.slice(0,60); CK.i = Math.min(CK.i, Math.max(0, CK.shown.length-1));
  let g=null, html="";
  CK.shown.forEach((x,i)=>{ if (!q && x.g!==g){ g=x.g; html+=`<div class="cmdk-g">${esc(g)}</div>`; }

  $("#cmdkl").querySelector(".cmdk-it.on")?.scrollIntoView({block:"nearest"});
}

/* ---------- trace waterfall */
const LIVE = ["running","thinking","subagents","awaiting_approval"];
function traceModel(s){
  const evs = (s.events||[]).slice().sort((a,b)=>a.t-b.t);
  const turns = [];
  evs.forEach((e,i)=>{ if (e.kind==="UserPromptSubmit") turns.push({start:e.t, prompt:cleanPrompt(e.text), i}); });
  if (!turns.length && evs.length) turns.push({start:evs[0].t, prompt:"(earlier activity)", i:0});
  turns.forEach((t,k)=>{ t.end = k+1<turns.length ? turns[k+1].start : null; });
  return {evs, turns};
}
function traceCard(s){
  const {evs, turns} = traceModel(s);
  if (!turns.length) return `<div class="card"><div class="card-b muted">No tool calls recorded for this session yet. Each prompt becomes a waterfall of tool calls here.</div></div>`;
  const ti = Math.min(turns.length-1, S.traceTurn ?? turns.length-1), T = turns[ti];
  const live = LIVE.includes(effStatus(s)) && ti===turns.length-1;
  const inTurn = evs.filter(e=>e.t>=T.start && (T.end==null || e.t<T.end));
  const stop = inTurn.find(e=>e.kind==="Stop"||e.kind==="StopFailure");
  const we0 = T.end ?? (live ? now() : (stop?.t ?? Math.max(T.start+1, ...inTurn.map(e=>e.t))));
  // spans
  const post = new Map(); inTurn.forEach(e=>{ if ((e.kind==="PostToolUse"||e.kind==="PostToolUseFailure") && e.id) post.set(e.id, e); });
  const spans = [];
  for (const e of inTurn){
    if (e.kind==="PreToolUse" && e.id){
      const p = post.get(e.id);
      const isSub = e.tool==="Task"||e.tool==="Agent";
      const sa = isSub ? (s.subagents||{})[e.id] : null;
      let end = p?.t, state = p ? (p.ok===false?"fail":"done") : "open";
      if (sa?.ended) { end = Math.max(end||0, sa.ended); state = sa.status==="failed"?"fail":"done"; }
      if (!end){ if (live || sa?.status==="running") { end = now(); state="run"; } else end = e.t; }
      spans.push({id:e.id, tool:e.tool, text:e.text, inp:e.inp, result:p?.result || sa?.result || "", start:e.t, end, state, agent:e.agent||null, sub:isSub, sa});
    }
    if (e.kind==="PermissionRequest"){
      const d = inTurn.find(x=>x.kind==="Decision" && x.t>=e.t && x.tool===e.tool);
      const pend = !d && (s.pending||[]).length;
      spans.push({id:"ap-"+e.t, tool:e.tool, text:e.text, start:e.t, end:d?.t ?? (pend||live?now():e.t), state:d?(d.ok?"done":"fail"):pend?"run":"done", appr:true, decision:d?.text||"waiting", agent:null});
    }
  }
  const ws = T.start, we = Math.max(we0, ...spans.map(x=>x.end), ws+1), span = we-ws;
  // nest subagent work under its Task span
  const kids = new Map(), roots = [];
  for (const x of spans){ if (x.agent && spans.some(y=>y.id===x.agent)) { (kids.get(x.agent)||kids.set(x.agent,[]).get(x.agent)).push(x); } else roots.push(x); }
  const rows = []; (function walk(list, d){ list.sort((a,b)=>a.start-b.start).forEach(x=>{ x.d=d; rows.push(x); if (kids.has(x.id)) walk(kids.get(x.id), d+1); }); })(roots, 0);
  const pct = t => (100*(t-ws)/span);
  const fails = spans.filter(x=>x.state==="fail" && !x.appr).length;
  const apprWait = spans.filter(x=>x.appr).reduce((a,x)=>a+(x.end-x.start),0);
  const sel = rows.find(x=>x.id===S.traceSel);
  const ticks = [0,.25,.5,.75,1].map(f=>`<span style="left:${f*100}%">${f? "+"+dur(span*f) : clock(ws)}</span>`).join("");
  const rowHtml = rows.slice(0,300).map(x=>{
    const color = x.appr ? "var(--s-appr)" : x.sub || x.d>0 ? "var(--c3)" : "var(--c1)";
    const L = pct(x.start), W = Math.max(.35, pct(x.end)-pct(x.start));
    const label = x.appr ? `approval · ${x.decision}` : x.state==="run" ? "running" : dur(x.end-x.start);
    const bar = `<div class="tr-bar ${x.sub?"sub":""} ${x.appr?"appr":""} ${x.state==="run"?"run":""} ${x.state==="fail"&&!x.appr?"fail":""}" style="--bc:${color};left:${L}%;width:${W}%"></div>`;
    const lab = `<span class="tr-lab" style="left:${Math.min(L+W,88)}%">${esc(label)}</span>`;
    const icn = x.appr ? "shield" : x.state==="fail" ? "x" : toolIcon(x.tool);
    return `<div class="tr-row ${S.traceSel===x.id?"sel":""}" data-key="r-${esc(x.id)}" data-trsel="${esc(x.id)}" data-tip="${esc(toolName(x.tool))} · ${esc(x.text||"")}">
      <div class="l" style="padding-left:${16+x.d*16}px">${x.d?`<span class="tw">└</span>`:""}${ic(icn, x.state==="fail"?'style="color:var(--s-err)"':x.appr?'style="color:var(--s-appr)"':"")}<b>${esc(x.sub?(x.sa?.type||"subagent"):toolName(x.tool))}</b><em>${esc(x.sub?(x.sa?.description||x.text):x.text||"")}</em></div>
      <div class="r">${bar}${lab}</div></div>`;
  }).join("");
  const detail = sel ? `<div class="tr-detail">
      <span class="k">Tool</span><span class="k">Started</span><span class="k">Duration</span><span class="k">Status</span><span></span>
      <span class="v">${esc(sel.sub?`${sel.sa?.type||"subagent"} (Task)`:toolName(sel.tool))}</span><span class="v">+${dur(sel.start-ws)} · ${clock(sel.start)}</span><span class="v">${sel.state==="run"?"running…":dur(sel.end-sel.start)}</span>
      <span class="v" style="color:${sel.state==="fail"?"var(--s-err)":sel.state==="run"?"var(--s-run)":"var(--s-idle)"}">${sel.appr?esc(sel.decision):{done:"ok",fail:"failed",run:"running",open:"no result recorded"}[sel.state]}</span><span></span>
      ${sel.inp||sel.text?`<pre class="code">${esc(sel.inp||sel.text)}</pre>`:""}
      ${sel.result?`<pre class="code" style="border-color:${sel.state==="fail"?"color-mix(in srgb,var(--s-err) 45%,var(--border))":"var(--border)"}">→ ${esc(sel.result)}</pre>`:""}
    </div>` : "";
  return `<div class="card">
    <div class="tr-head">
      <div class="tr-nav"><button data-trturn="${ti-1}" ${ti===0?"disabled":""} title="Previous turn">‹</button><span>turn ${ti+1}/${turns.length}</span><button data-trturn="${ti+1}" ${ti===turns.length-1?"disabled":""} title="Next turn">›</button></div>
      <div class="tr-prompt" title="${esc(T.prompt)}">${ic("user",'style="width:13px;height:13px;vertical-align:-2px;color:var(--accent)"')} ${esc(T.prompt)}</div>
      <div class="tr-stats"><span><b>${dur(span)}</b> ${live?"so far":"total"}</span><span><b>${spans.filter(x=>!x.appr).length}</b> calls</span>${fails?`<span class="bad"><b>${fails}</b> failed</span>`:""}${apprWait>=1?`<span class="appr"><b>${dur(apprWait)}</b> waiting on you</span>`:""}</div>
    </div>
    ${rows.length?`<div class="tr"><div class="tr-axis"><div class="l">${rows.length} spans${rows.length>300?" (first 300)":""}</div><div class="r">${ticks}</div></div>${rowHtml}</div>`
      :`<div class="card-b muted">No tool calls in this turn${live?" yet":""}.</div>`}
    ${detail}
    <div class="tr-legend"><span><i style="background:var(--c1)"></i>Main agent</span><span><i style="background:color-mix(in srgb,var(--c3) 25%,transparent);border:1px solid var(--c3)"></i>Subagent lifetime</span><span><i style="background:var(--c3)"></i>Subagent tool</span><span><i style="background:repeating-linear-gradient(45deg,var(--s-appr) 0 3px,transparent 3px 6px)"></i>Waiting for approval</span><span><i style="background:var(--s-err)"></i>Failed</span><span class="muted">Click a row for input and result</span></div>
  </div>`;
}

/* ---------- agent tree */
const phase = () => "";
function toolLeaves(counts, liveTool, max){
  const e = Object.entries(counts||{}).filter(([n])=>n!=="Task"&&n!=="Agent").sort((a,b)=>b[1]-a[1]);
  const out = e.slice(0,max).map(([n,c])=>({kind:"tool", tool:n, count:c, live: liveTool===n, children:[]}));
  if (e.length>max){ const rest=e.slice(max); out.push({kind:"more", count:rest.reduce((a,b)=>a+b[1],0), names:rest.map(r=>r[0]), children:[]}); }
  return out;
}
function buildTree(s){
  const subs = s.subagents||{};
  // main agent = all tool calls minus those made inside subagents (works for sessions recorded before per-agent counts existed)
  const mainCounts = {...(s.tool_counts||{})};
  for (const sa of Object.values(subs)) for (const [n,c] of Object.entries(sa.tool_counts||{})) mainCounts[n] = Math.max(0,(mainCounts[n]||0)-c);
  for (const k of Object.keys(mainCounts)) if (!mainCounts[k]) delete mainCounts[k];
  const root = {kind:"session", s, children:[]};
  const nodes = {};
  for (const sa of Object.values(subs)) nodes[sa.key] = {kind:"agent", sa, children:[]};
  const ordered = Object.values(subs).sort((a,b)=>a.started-b.started);
  for (const sa of ordered){
    const n = nodes[sa.key];
    const parent = sa.parent && nodes[sa.parent] ? nodes[sa.parent] : root;
    parent.children.push(n);
  }
  for (const sa of ordered){
    const n = nodes[sa.key];
    n.children = toolLeaves(sa.tool_counts, sa.status==="running"?sa.last_tool:null, 5).concat(n.children);
  }
  const mainLive = s.current && !["Task","Agent"].includes(s.current.tool) ? s.current.tool : null;
  root.children = root.children.concat(toolLeaves(mainCounts, mainLive, 7));
  return root;
}
function agentTreeCard(s){
  const root = buildTree(s);
  const ROW=62, COL=262, NW=214, NH=50;
  let row=0, maxDepth=0;
  (function lay(n,d){ n.d=d; maxDepth=Math.max(maxDepth,d);
    if (!n.children.length){ n.y=row++*ROW; } else { n.children.forEach(c=>lay(c,d+1)); n.y=(n.children[0].y+n.children[n.children.length-1].y)/2; }
    n.x=d*COL; })(root,0);
  const W = maxDepth*COL+NW+4, H = Math.max(row,1)*ROW-ROW+NH+4;
  const edges=[], boxes=[];
  (function walk(n){
    for (const c of n.children){
      const x1=n.x+NW, y1=n.y+NH/2, x2=c.x, y2=c.y+NH/2, mx=(x1+x2)/2;
      const flow = c.kind==="agent" && c.sa.status==="running" ? "flow" : (c.kind==="tool" && c.live) ? "flow-run" : "";
      edges.push(`<path class="${flow}" d="M${x1} ${y1} C${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}" ${flow?`style="${phase(1000)}"`:""}/>`);
      walk(c);
    }
    boxes.push(treeNode(n));

  const subs = Object.values(s.subagents||{});
  const sel = S.treeSel && s.subagents?.[S.treeSel];
  const empty = !subs.length && !Object.keys(s.tool_counts||{}).length;
  return `<div class="card"><div class="card-h">${ic("bot")}Agent tree<span class="sub">${subs.filter(x=>x.status==="running").length} running · ${subs.length} subagents · ${s.tools_total||0} tool calls</span></div>
    ${empty?`<div class="card-b muted">No tool calls yet. When Claude runs tools or spins up subagents, they branch out here live.</div>`:`
    <div class="tree-wrap"><div class="tree" style="width:${W}px;height:${H}px">
      <svg class="edges" width="${W}" height="${H}">${edges.join("")}</svg>${boxes.join("")}</div></div>
    <div class="tree-legend"><span><i></i>subagent working</span><span><i class="run"></i>tool running now</span><span><i class="solid"></i>finished</span><span class="muted">Click a subagent for its brief and result</span></div>`}
  </div>${sel?`<div class="card" style="margin-top:14px"><div class="card-h">${ic("bot")}Subagent details</div>${subagentRow(sel)}</div>`:""}`;
}
function treeNode(n){
  const pos = `left:${n.x}px;top:${n.y}px`;

    const s=n.s, st=effStatus(s), m=STATUS[st]||STATUS.idle;

    return `<button data-key="t-${esc(sa.key)}" class="tnode agent ${running?"running":""} ${sa.status==="failed"?"failed":""} ${S.treeSel===sa.key?"sel":""}" style="${pos};${running?phase(2000):""}" data-tsel="${esc(sa.key)}" data-tip="${esc(sa.type)}: ${esc(sa.description)}">
      <div class="t1">${sdot(running?"subagents":sa.status==="failed"?"error":"idle")}<span class="ty">${esc(sa.type)}</span><span class="lbl">${esc(sa.description)}</span></div>
      <div class="t2">${esc(meta)}</div></button>`;

    ${n.live?`<div class="t2" style="color:var(--s-run)">running now</div>`:""}</div>`;
}

/* ---------- hot files (squarified treemap) */
function squarify(items, x, y, w, h){
  const out=[]; const total=items.reduce((a,b)=>a+b.v,0); if(!total||w<=0||h<=0) return out;
  const q=items.map(d=>({d, v:d.v, a:d.v*w*h/total})); let row=[];
  const worst=(r,len)=>{ const s=r.reduce((a,b)=>a+b.a,0), mx=Math.max(...r.map(z=>z.a)), mn=Math.min(...r.map(z=>z.a)); return Math.max(len*len*mx/(s*s), (s*s)/(len*len*mn)); };
  const flush=()=>{ const s=row.reduce((a,b)=>a+b.a,0);
    if (w>=h){ const cw=s/h; let yy=y; for(const r of row){ const rh=r.a/cw; out.push({item:r,rx:x,ry:yy,rw:cw,rh}); yy+=rh; } x+=cw; w-=cw; }
    else { const rh=s/w; let xx=x; for(const r of row){ const rw=r.a/rh; out.push({item:r,rx:xx,ry:y,rw,rh}); xx+=rw; } y+=rh; h-=rh; }
    row=[]; };
  while(q.length){ const len=Math.min(w,h), it=q[0]; if(!row.length || worst([...row,it],len)<=worst(row,len)){ row.push(it); q.shift(); } else flush(); }
  if (row.length) flush();
  return out.map(o=>({...o, item:o.item.d}));
}
function fileData(s){
  if (S.fileScope==="project"){
    const c = S.projFiles[s.cwd];
    if (!c || Date.now()-c.t>10000){
      if (!c?.loading){ S.projFiles[s.cwd] = {...(c||{}), loading:true, t:c?.t||0};
        api("/api/project-files?cwd="+encodeURIComponent(s.cwd)).then(d=>{ S.projFiles[s.cwd]={t:Date.now(), data:d}; schedule(); }).catch(()=>{ S.projFiles[s.cwd]={t:Date.now(), data:null}; }); }
    }

  }

}
function hotFilesCard(s){

      cells += `<div data-key="f-${esc(f.path)}" class="fc k-${f.kind} ${fresh?"fresh":""}" style="left:${pct(fr.rx+1,W)};top:${pct(fr.ry+1,H)};width:${pct(Math.max(0,fr.rw-2),W)};height:${pct(Math.max(0,fr.rh-2),H)};${fresh?phase(1600):""}" data-tip="${esc(tip)}" data-copypath="${esc(f.path)}">

      <span class="muted" style="margin-left:auto">Size = reads + 2× edits/writes (tools and shell: redirects, sed/perl -i, cp/mv, python) · glowing = last 90s · click to copy path</span></div>
    <div class="tm" role="img" aria-label="Treemap of files touched">${cells}</div>
    ${files.length>shown.length?`<div class="note">Showing the ${shown.length} hottest of ${files.length} files.</div>`:""}
  </div>
  <div class="tblwrap"><table class="tbl"><tr><th>File</th><th class="num">Reads</th><th class="num">Edits</th><th class="num">Writes</th><th class="num">Lines</th><th class="num">Last touched</th></tr>
    ${top.map(f=>`<tr><td title="${esc(f.path)}"><span class="sw k-${f.kind}" style="display:inline-block;margin-right:8px;background:var(--fc)"></span>${esc(f.rel)}</td><td class="num">${f.r||0}</td><td class="num">${f.e||0}</td><td class="num">${f.w||0}</td>
      <td class="num">${f.add?`<span class="plus">+${f.add}</span> <span class="minus">−${f.del||0}</span>`:""}</td><td class="num">${ago(f.last)} ago</td></tr>`).join("")}
  </table></div></div>`;

function trendSvg(hist, idx, windowSec){
  const t0 = now()-windowSec; const pts = (hist||[]).filter(h=>h[0]>=t0 && h[idx]!=null);
  if (pts.length<2) return `<div class="note">Trend appears after a few minutes of activity.</div>`;
  const W=300,H=48; const xy = pts.map(h=>[ (h[0]-t0)/windowSec*W, H-2-(Math.min(100,h[idx])/100)*(H-4) ]);
  const d = xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="usage trend">
    <line x1="0" x2="${W}" y1="${H-2-0.8*(H-4)}" y2="${H-2-0.8*(H-4)}" stroke="var(--border-strong)" stroke-dasharray="3 3" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <path d="${d}" fill="none" stroke="var(--sc)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
function limitCard(title, w, hist, idx, windowSec, sub){
  if (!w || w.used_percentage==null) return "";
  const p = Math.max(0, w.used_percentage), L = lvl(p), [lab, icn] = lvlLabel[L];
  return `<div class="card lim lvl-${L}"><div class="hd">${esc(title)}<span class="pill" style="--sc:var(--sc)">${ic(icn)}${lab}</span></div>
    <div class="big">${p.toFixed(0)}%<small> used${sub?` · ${esc(sub)}`:""}</small></div>
    <div class="meter"><i style="width:${Math.min(100,p)}%"></i></div>
    <div class="rs">${untilTxt(w.resets_at)}</div>
    ${idx!=null?trendSvg(hist, idx, windowSec):""}</div>`;
}
function accountView(){
  const A = S.account || {daily:{},models:{},projects:[],hosts:{}};
  const limEntries = Object.entries(S.limits||{}).filter(([,l])=>l?.rate_limits).sort((a,b)=>b[1].ts-a[1].ts);
  // date helpers
  const dayKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const today = new Date(now()*1000);
  const sumDays = n => { let c=0,t=0,o=0,m=0; for (let i=0;i<n;i++){ const d=new Date(today.getTime()-i*864e5); const x=A.daily[dayKey(d)]; if(x){c+=x.cost;t+=x.tok;o+=x.out;m+=x.msgs;} } return {c,t,o,m}; };
  const d1=sumDays(1), d7=sumDays(7), d30=sumDays(30);
  const live = [...S.sessions.values()].filter(s=>["running","thinking","subagents","awaiting_approval","waiting_input"].includes(effStatus(s)));
  const liveCost = live.reduce((n,s)=>n+(s.cost_usd ?? s.usage?.cost ?? 0),0);
  const stat = (v,l,sub) => `<div class="card stat"><div class="v">${v}</div><div class="l">${l}</div>${sub?`<div class="s">${sub}</div>`:""}</div>`;

  // limits section
  let limHtml;
  if (limEntries.length){
    limHtml = limEntries.map(([hk,l])=>{
      const h = S.hosts.get(hk) || {hostname:hk}; const rl=l.rate_limits; const hist=S.limitHist[hk];
      const sp = rl.spend_limit;
      return `<div class="section-title" style="margin-top:${limEntries.length>1?"14px":"0"}">${ic(h.local?"laptop":"server",'style="width:13px;height:13px;vertical-align:-2px"')} ${esc(h.user?h.user+"@":"")}${esc(h.hostname)} · updated <span data-ago="${l.ts}"></span> ago</div>
        <div class="limits">
          ${limitCard("Current 5-hour session", rl.five_hour, hist, 1, 86400)}
          ${limitCard("Weekly · all models", rl.seven_day, hist, 2, 7*86400)}
          ${sp?limitCard(`Spend limit${sp.period?` · ${sp.period}`:""}`, sp, null, null, 0, sp.used_usd!=null&&sp.limit_usd!=null?`${money(sp.used_usd)} of ${money(sp.limit_usd)}`:""):""}
        </div>`;
    }).join("");
  } else {
    limHtml = `<div class="card help"><h3>${ic("clock",'style="vertical-align:-3px"')} Plan limits not reported yet</h3>
      <p>The 5-hour and weekly limits come from Claude Code's status line, which includes them for claude.ai Pro, Max and Ultra subscribers after the first response in a session.</p>
      <p>Turn on the relay once (your current status line keeps working), then send any prompt:</p>
      <pre class="code">/agent-cockpit:account-limits     # inside Claude Code (plugin install)
cockpit statusline on            # terminal (pip install)</pre>
      <p class="muted">API-key and Bedrock/Vertex users don't have plan limits; the token and cost estimates below still apply.</p></div>`;
  }

  // daily chart
  const n = S.acctRange, metric = S.acctMetric;
  const days=[]; for (let i=n-1;i>=0;i--){ const d=new Date(today.getTime()-i*864e5); const k=dayKey(d); days.push([d,k,A.daily[k]||{cost:0,tok:0,out:0,msgs:0}]); }
  const val = x => metric==="cost"? x.cost : metric==="out"? x.out : x.tok;
  const fmtV = v => metric==="cost"? money(v) : fmtN(v)+" tok";
  const mx = Math.max(1e-9, ...days.map(d=>val(d[2])));
  const tot = days.reduce((a,d)=>a+val(d[2]),0);
  const chart = `<div class="card"><div class="card-h">${ic("zap")}Daily usage · all machines
      <div class="seg2" style="margin-left:auto">${[["cost","Est. cost"],["tok","Tokens"],["out","Output"]].map(([k,l])=>`<button data-am="${k}" class="${metric===k?"on":""}">${l}</button>`).join("")}</div>
      <div class="seg2">${[[14,"14d"],[30,"30d"],[90,"90d"]].map(([k,l])=>`<button data-ar="${k}" class="${n===k?"on":""}">${l}</button>`).join("")}</div></div>
