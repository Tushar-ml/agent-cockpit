      <div class="bars">${days.map(([d,k,x],i)=>`<i class="${i===n-1?"today":""}" style="height:${Math.max(1.5,100*val(x)/mx)}%" data-tip="${d.toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"})} · ${money(x.cost)} · ${fmtN(x.tok)} tokens · ${x.msgs} responses"></i>`).join("")}</div>
      <div class="bars-l"><span>${days[0][0].toLocaleDateString([], {month:"short",day:"numeric"})}</span><span>today</span></div></div></div>`;

  // models
  const models = Object.entries(A.models||{}).sort((a,b)=>b[1].cost-a[1].cost);
  const mcost = Math.max(1e-9, ...models.map(m=>m[1].cost));
  const modelTbl = `<div class="card"><div class="card-h">${ic("cpu")}By model<span class="sub">all time</span></div><div class="tblwrap"><table class="tbl">
    <tr><th>Model</th><th class="num">Responses</th><th class="num">Input</th><th class="num">Cache read</th><th class="num">Cache write</th><th class="num">Output</th><th>Est. cost</th></tr>
    ${models.map(([m,x])=>`<tr><td>${esc(shortModel(m))}</td><td class="num">${x.msgs.toLocaleString()}</td><td class="num">${fmtN(x.in)}</td><td class="num">${fmtN(x.cr)}</td><td class="num">${fmtN(x.cw)}</td><td class="num">${fmtN(x.out)}</td><td><span class="share"><i style="width:${100*x.cost/mcost}%"></i></span>${money(x.cost)}</td></tr>`).join("") || `<tr><td colspan="7" class="muted">No usage yet</td></tr>`}
  </table></div></div>`;

  // projects
  const projs = (A.projects||[]).slice(0,15);
  const pcost = Math.max(1e-9, ...projs.map(p=>p.cost));
  const projTbl = `<div class="card"><div class="card-h">${ic("folder")}Top projects<span class="sub">by estimated cost, all time</span></div><div class="tblwrap"><table class="tbl">
    <tr><th>Project</th><th>Machine</th><th class="num">Responses</th><th class="num">Tokens</th><th>Est. cost</th><th class="num">Last active</th></tr>
    ${projs.map(p=>{ const h=S.hosts.get(p.host)||{hostname:(p.host||"").split("@")[1]||p.host}; const lt=p.last?Date.parse(p.last)/1000:0;
      return `<tr><td><b>${esc(p.project)}</b></td><td>${esc(h.hostname)}${h.ssh?' <span class="badge ssh">SSH</span>':""}</td><td class="num">${p.msgs.toLocaleString()}</td><td class="num">${fmtN(p.tok)}</td><td><span class="share"><i style="width:${100*p.cost/pcost}%"></i></span>${money(p.cost)}</td><td class="num">${lt?ago(lt)+" ago":""}</td></tr>`; }).join("") || `<tr><td colspan="6" class="muted">No usage yet</td></tr>`}
  </table></div></div>`;

  // hosts
  const hostsArr = Object.entries(A.hosts||{}).sort((a,b)=>b[1].cost-a[1].cost);
  const hostTbl = hostsArr.length>1 ? `<div class="card"><div class="card-h">${ic("server")}By machine</div><div class="tblwrap"><table class="tbl">
    <tr><th>Machine</th><th class="num">Responses</th><th class="num">Tokens</th><th class="num">Est. cost</th></tr>
    ${hostsArr.map(([hk,x])=>{ const h=S.hosts.get(hk)||{hostname:hk}; return `<tr><td>${esc(h.user?h.user+"@":"")}${esc(h.hostname)}</td><td class="num">${x.msgs.toLocaleString()}</td><td class="num">${fmtN(x.tok)}</td><td class="num">${money(x.cost)}</td></tr>`; }).join("")}
  </table></div></div>` : "";

  const since = A.first ? new Date(A.first).toLocaleDateString([], {month:"short",day:"numeric",year:"numeric"}) : "";
  return `
    <div class="sess-h"><div><h1>Account usage</h1><div class="title">Plan limits, plus token usage and API-equivalent cost across every session on every machine${since?` since ${since}`:""}.</div></div></div>
    <div class="section-title" style="margin-top:0">Plan limits</div>
    ${limHtml}
    <div class="section-title">Spend estimate</div>
    <div class="acct-top">
      ${stat(money(d1.c),"Today",`${fmtN(d1.t)} tokens · ${d1.m} responses`)}
      ${stat(money(d7.c),"Last 7 days",`${fmtN(d7.t)} tokens`)}
      ${stat(money(d30.c),"Last 30 days",`${fmtN(d30.t)} tokens`)}
      ${stat(money(A.cost),"All time",`${fmtN(A.tok)} tokens · ${(A.msgs||0).toLocaleString()} responses`)}
      ${stat(money(liveCost),"Active sessions now",`${live.length} working`)}
    </div>
    <div class="note">Costs are estimates at Anthropic API list prices (cache writes and reads priced separately). On a Pro/Max plan you aren't billed per token, so read these as API-equivalent value; your plan limits above are what actually cap you.</div>
    <div class="stack" style="margin-top:18px">${chart}${modelTbl}${projTbl}${hostTbl}</div>`;
}

  const stc = sa.status==="running"?"subagents": sa.status==="done"?"idle": sa.status==="failed"?"error":"ended";
  const end = sa.ended || now();
  return `<div class="sa"><div class="r1">${sdot(stc)}<span class="ty">${esc(sa.type)}</span><span class="ds" title="${esc(sa.description)}">${esc(sa.description)}</span>
    <span class="pill st-${stc}">${esc(sa.status==="running"?(sa.background?"background":"running"):sa.status)}</span></div>
    ${sa.status==="running"?`<div class="ln">${sa.last_tool?`${esc(toolName(sa.last_tool))} · `:""}${esc(sa.last_detail||"")}</div>`:""}
    <div class="mt"><span>${sa.status==="running"?`<span data-since="${sa.started}"></span>`:dur(end-sa.started)}</span><span>${sa.tools||0} tool calls</span>${sa.tokens?`<span>${fmtN(sa.tokens)} tokens</span>`:""}${sa.model?`<span>${esc(sa.model)}</span>`:""}</div>

function timeline(s){
  let evs = (s.events||[]).slice().reverse();
  const f=S.tl;
  if (f==="tools") evs = evs.filter(e=>e.kind==="PostToolUse"||e.kind==="PostToolUseFailure"||e.kind==="PreToolUse");
  if (f==="prompts") evs = evs.filter(e=>e.kind==="UserPromptSubmit"||e.kind==="Stop");
  if (f==="errors") evs = evs.filter(e=>e.ok===false);
  // hide PreToolUse rows that already have a matching Post
  const done = new Set(evs.filter(e=>e.kind.startsWith("PostToolUse")).map(e=>e.id));
  evs = evs.filter(e=>!(e.kind==="PreToolUse" && e.id && done.has(e.id)));
  if (!evs.length) return `<div class="card-b muted">${s.source==="scan"?"This session was found in transcript history — live activity appears once it runs with the hooks installed.":"No events yet."}</div>`;
  const subs = s.subagents||{};
  return evs.slice(0,250).map(e=>{
    let icn="zap", cls="", head=esc(e.kind), x=esc(e.text||""), mono=false, r="";
    const agent = e.agent && subs[e.agent] ? `<span class="agent">↳ ${esc(subs[e.agent].type)}</span>` : "";
    switch(e.kind){
      case "UserPromptSubmit": icn="user"; cls="prompt"; head=(e.text||"").startsWith("<task-notification>")?"Background task":"You"; x=esc(cleanPrompt(e.text)); break;
      case "Stop": icn="sparkle"; cls="ok"; head="Claude finished the turn"; break;
      case "StopFailure": icn="alert"; cls="bad"; head="Turn failed"; break;
      case "PreToolUse": icn=toolIcon(e.tool); head=`${esc(toolName(e.tool))} <span class="muted" style="font-weight:500">running…</span>`; mono=true; break;
      case "PostToolUse": case "PostToolUseFailure": icn=e.ok===false?"x":toolIcon(e.tool); cls=e.ok===false?"bad":"ok"; head=esc(toolName(e.tool)) + (e.dur?` <span class="muted" style="font-weight:500">${dur(e.dur)}</span>`:""); mono=["Bash","Read","Edit","Write","Grep","Glob"].includes(e.tool); r=e.result||""; break;
      case "PermissionRequest": icn="shield"; cls="appr"; head=`Approval requested · ${esc(toolName(e.tool))}`; mono=true; break;
      case "Decision": icn=e.ok?"check":"x"; cls=e.ok?"ok":"bad"; head=esc(e.text); x=esc(toolName(e.tool)); break;
      case "SubagentStart": icn="bot"; cls="sub"; head="Subagent started"; break;
      case "SubagentStop": icn="bot"; cls="sub"; head="Subagent finished"; break;
      case "Notification": icn="bell"; cls="appr"; head="Notification"; break;
      case "SessionStart": icn="play"; head="Session started"; break;
      case "SessionEnd": icn="stop"; head="Session ended"; break;
      case "PreCompact": icn="compress"; head="Compacting context"; break;
    }
    return `<div class="ev" data-key="e-${e.t}-${e.kind}-${esc(e.id||"")}"><div class="ic ${cls}">${ic(icn)}</div><div style="min-width:0"><div class="h">${head}${agent}</div>
      ${x?`<div class="x ${mono?"mono":""}">${x}</div>`:""}${r?`<div class="r" title="${esc(r)}">→ ${esc(r)}</div>`:""}</div><div class="tm">${clock(e.t)}</div></div>`;
  }).join("");
}

function usageCard(s,u){
  const total = tot(u);
  const parts = [["Cache read",u.cr,"--c1"],["Cache write",u.cw,"--c2"],["Input",u.in,"--c3"],["Output",u.out,"--c4"]];
  const win = s.ctx_size || ctxWindow(s), pct = s.ctx_pct!=null ? Math.min(100, s.ctx_pct) : Math.min(100, 100*(u.ctx||0)/win);
  const gc = pct>85?"var(--s-err)":pct>65?"var(--s-appr)":"var(--s-run)";
  const models = Object.entries(u.by_model||{}).sort((a,b)=>tot(b[1])-tot(a[1]));
  // last 24 hours, hourly buckets (UTC keys from transcript timestamps)
  const hb = u.hourly||{}; const bars=[]; const nowD=new Date(now()*1000);
  for (let i=23;i>=0;i--){ const d=new Date(nowD.getTime()-i*3600e3); const k=d.toISOString().slice(0,13); bars.push([d,hb[k]||0]); }
  const mx = Math.max(1,...bars.map(b=>b[1]));
  const cacheHit = (u.cr||0)/Math.max(1,(u.cr||0)+(u.cw||0)+(u.in||0));
  return `<div class="card"><div class="card-h">${ic("zap")}Token usage<span class="sub">${u.msgs||0} API responses</span></div><div class="card-b">
    <div class="hero-num">${fmtN(total)}${u.cost?` <span style="font-size:15px;color:var(--muted);font-weight:600">≈ ${money(s.cost_usd ?? u.cost)}</span>`:""}</div><div class="hero-sub">total tokens · ${fmtN(u.out)} generated · ${(cacheHit*100).toFixed(0)}% of input served from cache${u.side?` · ${fmtN(u.side)} by subagents`:""}</div>
    <div class="stackbar" role="img" aria-label="Token mix">${parts.filter(p=>p[1]>0).map(p=>`<i style="flex:${p[1]};background:var(${p[2]})" data-tip="${p[0]}: ${(+p[1]).toLocaleString()} tokens (${(100*p[1]/Math.max(1,total)).toFixed(1)}%)"></i>`).join("")}</div>
    <div class="legend">${parts.map(p=>`<div><span class="sw" style="background:var(${p[2]})"></span>${p[0]}<b>${fmtN(p[1])}</b></div>`).join("")}</div>
    <div class="gauge" style="--gc:${gc}"><div class="gl"><span>Context window</span><span><b>${fmtN(u.ctx||0)}</b> / ${fmtN(win)} · ${pct.toFixed(0)}%</span></div><div class="gt"><i style="width:${pct}%"></i></div></div>
    <div style="margin-top:16px;font-size:12px;color:var(--text-2);display:flex;justify-content:space-between"><span>Tokens per hour · last 24h</span><span class="muted">peak ${fmtN(mx)}</span></div>
    <div class="spark">${bars.map(([d,v])=>`<i style="height:${Math.max(2,100*v/mx)}%" data-tip="${d.toLocaleTimeString([], {hour:"2-digit"})} · ${v.toLocaleString()} tokens"></i>`).join("")}</div>
    <div class="spark-l"><span>24h ago</span><span>12h</span><span>now</span></div>
    ${models.length?`<table class="mini"><tr><th>Model</th><th>Calls</th><th>Output</th><th>Total</th></tr>${models.map(([m,x])=>`<tr><td>${esc(shortModel(m))}</td><td>${x.msgs}</td><td>${fmtN(x.out)}</td><td>${fmtN(tot(x))}</td></tr>`).join("")}</table>`:""}
  </div></div>`;
}
function toolMix(s){
  const e = Object.entries(s.tool_counts||{}).sort((a,b)=>b[1]-a[1]).slice(0,10);
  if (!e.length) return "";
  const mx = e[0][1];
  return `<div class="card"><div class="card-h">${ic("terminal")}Tool calls<span class="sub">${s.tools_total} total · ${s.errors||0} failed</span></div><div class="card-b">
    ${e.map(([n,v])=>`<div class="hbar"><span class="n" title="${esc(n)}">${esc(toolName(n))}</span><span class="t"><i style="width:${100*v/mx}%"></i></span><b>${v}</b></div>`).join("")}</div></div>`;
}

/* ------------------------------------------------------------- events */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-newcard],[data-cedit],[data-cmove],[data-smove],[data-totask],[data-goal],[data-open],#navBoard,[data-trsel],[data-trturn],#btnDensity,#btnCmdk,[data-sel],[data-dec],[data-tl],[data-copy],[data-dismiss],[data-am],[data-ar],[data-stab],[data-tsel],[data-fscope],[data-copypath],#navOverview,#navAccount,#seg button,#btnTheme,#btnSound,#btnNotify");
  if (!t) return;
  if (t.dataset.sel){ e.preventDefault(); const id=t.dataset.sel; go(()=>{ if (S.sel!==id){ S.treeSel=null; S.traceSel=null; S.traceTurn=null; } S.sel=id; history.replaceState(null,"","#"+encodeURIComponent(id)); }); window.scrollTo({top:0}); return; }
  if (t.dataset.dec) return decide(t.dataset.aid, t.dataset.dec);
  if (t.dataset.tl){ S.tl=t.dataset.tl; render(); return; }
  if (t.dataset.copy){ const s=S.sessions.get(t.dataset.copy); const cmd=`cd ${JSON.stringify(s.cwd)} && claude --resume ${s.id}`; navigator.clipboard?.writeText(cmd).then(()=>toast("Copied: "+cmd)).catch(()=>toast(cmd)); return; }
  if (t.dataset.dismiss){ api(`/api/session/${t.dataset.dismiss}/dismiss`,{method:"POST"}).then(()=>{S.sessions.delete(t.dataset.dismiss); S.sel=null; render();}); return; }
  if (t.id==="navOverview"){ go(()=>{ S.sel=null; S.page="overview"; history.replaceState(null,"","#"); }); return; }
  if (t.id==="navAccount"){ go(()=>{ S.sel=null; S.page="account"; history.replaceState(null,"","#account"); }); window.scrollTo({top:0}); return; }
  if (t.id==="navBoard"){ go(()=>{ S.sel=null; S.page="board"; history.replaceState(null,"","#board"); }); return; }
  if (t.dataset.newcard){ openCard(null, {col:t.dataset.newcard}); return; }
  if (t.dataset.cmove){ moveItem("c:"+t.dataset.cmove, t.dataset.col); return; }
  if (t.dataset.smove!=null && t.dataset.smove!==undefined && t.hasAttribute("data-smove")){ moveItem("s:"+t.dataset.smove, t.dataset.col); return; }
  if (t.dataset.totask){ const s=S.sessions.get(t.dataset.totask); openCard(null, {title:(s.title||cleanPrompt(s.prompt)||s.project).slice(0,200), notes:cleanPrompt(s.prompt)||"", cwd:s.cwd, session:s.id, col:"running"}); return; }
  if (t.dataset.cedit){ openCard(t.dataset.cedit); return; }
  if (t.hasAttribute("data-goal")){ S.boardGoal = t.dataset.goal && S.boardGoal!==t.dataset.goal ? t.dataset.goal : null; render(); return; }
  if (t.dataset.open){ const id=t.dataset.open; go(()=>{ S.sel=id; S.stab="activity"; history.replaceState(null,"","#"+encodeURIComponent(id)); }); window.scrollTo({top:0}); return; }
  if (t.dataset.trsel){ S.traceSel = S.traceSel===t.dataset.trsel ? null : t.dataset.trsel; render(); return; }
  if (t.dataset.trturn!=null && !t.disabled){ S.traceTurn=+t.dataset.trturn; S.traceSel=null; render(); return; }
  if (t.id==="btnDensity"){ prefs.compact=!prefs.compact; savePrefs(); renderTools(); toast(prefs.compact?"Compact density":"Comfortable density"); return; }
  if (t.id==="btnCmdk"){ openCmdk(); return; }
  if (t.dataset.am){ S.acctMetric=t.dataset.am; render(); return; }
  if (t.dataset.stab){ go(()=>{ S.stab=t.dataset.stab; }); return; }
  if (t.dataset.tsel){ S.treeSel = S.treeSel===t.dataset.tsel ? null : t.dataset.tsel; render(); return; }
  if (t.dataset.fscope){ S.fileScope=t.dataset.fscope; render(); return; }
  if (t.dataset.copypath){ navigator.clipboard?.writeText(t.dataset.copypath).then(()=>toast("Copied path")).catch(()=>{}); return; }
  if (t.dataset.ar){ S.acctRange=+t.dataset.ar; render(); return; }
  if (t.parentElement?.id==="seg"){ S.filter=t.dataset.f; document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b===t)); render(); return; }
  if (t.id==="btnTheme"){ const order=["auto","dark","light"]; prefs.theme=order[(order.indexOf(prefs.theme||"auto")+1)%3]; savePrefs(); applyTheme(); renderTools(); toast("Theme: "+prefs.theme); return; }
  if (t.id==="btnSound"){ prefs.sound = prefs.sound===false; savePrefs(); renderTools(); if (prefs.sound) beep(); return; }
  if (t.id==="btnNotify"){
    if (!("Notification" in window)) return toast("Notifications not supported");
    if (prefs.notify){ prefs.notify=false; savePrefs(); renderTools(); return; }
    Notification.requestPermission().then(p=>{ prefs.notify = p==="granted"; savePrefs(); renderTools(); toast(p==="granted"?"Desktop notifications on":"Notifications blocked by browser"); });
  }
});
$("#q").addEventListener("input", e=>{ S.q=e.target.value; render(); });
document.addEventListener("keydown", e=>{
  if (e.target.matches("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const a = pendingApprovals()[0];
  if (a && (e.key==="a"||e.key==="A")) { decide(a.id, e.shiftKey && a.suggestions?.length ? "always" : "allow"); }
  else if (a && e.key==="d") decide(a.id, "deny");
  else if (e.key==="j"||e.key==="k"){ const l=visibleSessions(); if(!l.length) return; let i=l.findIndex(s=>s.id===S.sel); i = e.key==="j"? Math.min(l.length-1,i+1) : Math.max(0,i-1); S.sel=l[i].id; render(); }
  else if (e.key==="Escape" && S.sel){ go(()=>{ S.sel=null; }); }
  else if (e.key==="Enter" && e.target.matches?.(".kc")){ e.target.click(); }
  else if (e.key==="n" && S.page==="board" && !S.sel){ e.preventDefault(); openCard(null,{col:"backlog"}); }
  else if (e.key==="/"){ e.preventDefault(); $("#q").focus(); }
});
const tip=$("#tip");
document.addEventListener("mouseover", e=>{ const t=e.target.closest("[data-tip]"); if(!t){tip.style.opacity=0;return;} tip.textContent=t.dataset.tip; tip.style.opacity=1; });
document.addEventListener("mousemove", e=>{ tip.style.left=Math.min(innerWidth-tip.offsetWidth-8, e.clientX+12)+"px"; tip.style.top=(e.clientY-34)+"px"; });

applyTheme(); renderTools();
setInterval(()=>{ updateTimers(); renderKpis(); }, 1000);
setInterval(()=>{ lastSig.view=""; renderView(); }, 5000); // relative times / running bars in the main view
setInterval(()=>{ lastSig.side=""; renderSide(); }, 15000);
connect();
</script>
