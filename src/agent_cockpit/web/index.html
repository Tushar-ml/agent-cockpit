<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d97757'/%3E%3Cpath d='M16 6l2.6 7.4L26 16l-7.4 2.6L16 26l-2.6-7.4L6 16l7.4-2.6z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light;
  --bg:#f4f3ef; --surface:#ffffff; --surface-2:#f8f7f4; --surface-3:#efeee9; --border:#e3e1da; --border-strong:#cfccc2;
  --text:#141413; --text-2:#52514e; --muted:#8a887f; --accent:#c96442; --accent-soft:#f6e3db;
  --s-run:#2a78d6; --s-think:#6250d6; --s-sub:#1baf7a; --s-appr:#c98500; --s-wait:#d9652f; --s-idle:#0c8a0c; --s-err:#d03b3b; --s-end:#8a887f;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100;
  --code-bg:#f3f1ec; --diff-add:#e3f4e3; --diff-del:#fbe4e4;
  --shadow:0 1px 2px rgba(20,20,19,.04),0 4px 16px rgba(20,20,19,.05);
  --glow:0 0 0 1px rgba(201,133,0,.35),0 8px 30px rgba(201,133,0,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0f0f0e; --surface:#181817; --surface-2:#1e1e1c; --surface-3:#262624; --border:#2b2b28; --border-strong:#3a3a36;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8b8a82; --accent:#e08a68; --accent-soft:#3a2219;
    --s-run:#3987e5; --s-think:#9085e9; --s-sub:#22b882; --s-appr:#fab219; --s-wait:#ec835a; --s-idle:#2fbf2f; --s-err:#e66767; --s-end:#7a7972;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
    --code-bg:#121211; --diff-add:#14301a; --diff-del:#3a1717;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --glow:0 0 0 1px rgba(250,178,25,.4),0 8px 34px rgba(250,178,25,.14);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0f0f0e; --surface:#181817; --surface-2:#1e1e1c; --surface-3:#262624; --border:#2b2b28; --border-strong:#3a3a36;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8b8a82; --accent:#e08a68; --accent-soft:#3a2219;
  --s-run:#3987e5; --s-think:#9085e9; --s-sub:#22b882; --s-appr:#fab219; --s-wait:#ec835a; --s-idle:#2fbf2f; --s-err:#e66767; --s-end:#7a7972;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
  --code-bg:#121211; --diff-add:#14301a; --diff-del:#3a1717;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --glow:0 0 0 1px rgba(250,178,25,.4),0 8px 34px rgba(250,178,25,.14);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
code,pre,.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:12px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted)}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--s-err)}
.conn.on i{background:var(--s-idle);box-shadow:0 0 0 3px color-mix(in srgb,var(--s-idle) 22%,transparent)}
.kpis{display:flex;gap:10px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.kpi{display:flex;flex-direction:column;justify-content:center;padding:6px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);min-width:118px}
.kpi b{font-size:18px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:11px;color:var(--muted);white-space:nowrap}
.kpi.hot{border-color:var(--s-appr);box-shadow:var(--glow)}
.kpi.hot b{color:var(--s-appr)}
.tools{display:flex;gap:6px}
.iconbtn{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text-2)}
.iconbtn:hover{border-color:var(--border-strong);color:var(--text)}
.iconbtn.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}

/* ---------- layout */
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:calc(100vh - 61px)}
aside{border-right:1px solid var(--border);padding:14px 12px 40px;position:sticky;top:61px;height:calc(100vh - 61px);overflow-y:auto}
main{padding:20px 24px 60px;min-width:0}
.search{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--muted);margin-bottom:10px}
.search input{border:0;outline:0;background:transparent;color:var(--text);font:inherit;width:100%}
.seg{display:flex;padding:3px;background:var(--surface-3);border-radius:9px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;padding:5px 8px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.navitem{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:9px;border:0;background:transparent;text-align:left;font-weight:550;color:var(--text-2);margin-bottom:6px}
.navitem:hover{background:var(--surface-3)}
.navitem.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.hostgrp{margin-top:14px}
.hosthead{display:flex;align-items:center;gap:8px;padding:4px 6px 8px;font-size:12px;color:var(--text-2);font-weight:600}
.hosthead .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hosthead .dot{width:7px;height:7px;border-radius:50%;background:var(--s-end);flex:none}
.hosthead .dot.on{background:var(--s-idle)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:99px;font-size:10.5px;font-weight:600;letter-spacing:.02em;border:1px solid var(--border);color:var(--text-2);background:var(--surface-2);white-space:nowrap}
.badge.ssh{color:var(--s-think);border-color:color-mix(in srgb,var(--s-think) 40%,var(--border))}
.badge.local{color:var(--s-run);border-color:color-mix(in srgb,var(--s-run) 40%,var(--border))}
.badge.warn{color:var(--s-appr);border-color:color-mix(in srgb,var(--s-appr) 50%,var(--border))}
.scard{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:11px;padding:9px 10px;margin-bottom:4px;position:relative}
.scard:hover{background:var(--surface-3)}
.scard.on{background:var(--surface);border-color:var(--border);box-shadow:var(--shadow)}
.scard .row1{display:flex;align-items:center;gap:8px}
.scard .proj{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.scard .ago{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.scard .act{font-size:12px;color:var(--text-2);margin:3px 0 0 16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scard .meta{display:flex;gap:6px;margin:5px 0 0 16px;flex-wrap:wrap}
.scard.dim{opacity:.62}
.empty-side{font-size:12.5px;color:var(--muted);padding:12px 8px}

/* ---------- status */
.sdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--sc);position:relative}
.sdot.pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--sc);opacity:0;animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.8}100%{transform:scale(1.6);opacity:0}}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:99px;font-size:12px;font-weight:600;color:var(--sc);background:color-mix(in srgb,var(--sc) 12%,transparent);border:1px solid color-mix(in srgb,var(--sc) 30%,transparent);white-space:nowrap}
.pill .svg{width:13px;height:13px}
.st-running{--sc:var(--s-run)} .st-thinking{--sc:var(--s-think)} .st-subagents{--sc:var(--s-sub)} .st-awaiting_approval{--sc:var(--s-appr)}
.st-waiting_input{--sc:var(--s-wait)} .st-idle{--sc:var(--s-idle)} .st-error{--sc:var(--s-err)} .st-ended{--sc:var(--s-end)} .st-quiet{--sc:var(--s-end)}

/* ---------- cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px}
.card-h .sub{color:var(--muted);font-weight:500;font-size:12px;margin-left:auto}
.card-b{padding:14px 16px}
.section-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 10px}

/* ---------- approvals */
.dock{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.appr{border:1px solid color-mix(in srgb,var(--s-appr) 55%,var(--border));box-shadow:var(--glow);border-radius:14px;background:var(--surface);overflow:hidden;animation:slidein .25s ease-out}
@keyframes slidein{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.appr-h{display:flex;align-items:center;gap:10px;padding:12px 16px;background:color-mix(in srgb,var(--s-appr) 9%,var(--surface))}
.appr-h .t{font-weight:650}
.appr-h .where{color:var(--text-2);font-size:12.5px}
.appr-h .timer{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.appr-bar{height:3px;background:var(--surface-3)}
.appr-bar i{display:block;height:100%;background:var(--s-appr);transition:width 1s linear}
.appr-b{padding:12px 16px}
.appr-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface-2)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);font-weight:600;font-size:13px}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.primary:hover{opacity:.9}
.btn.good{color:var(--s-idle);border-color:color-mix(in srgb,var(--s-idle) 45%,var(--border))}
.btn.bad{color:var(--s-err);border-color:color-mix(in srgb,var(--s-err) 45%,var(--border))}
.btn kbd{font:500 10.5px "JetBrains Mono",monospace;padding:0 5px;border-radius:4px;border:1px solid currentColor;opacity:.6}
.reason{flex:1;min-width:180px;padding:8px 10px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font:inherit;font-size:13px}
.rule{font:12px "JetBrains Mono",monospace;padding:2px 7px;border-radius:6px;background:var(--surface-3);color:var(--text-2)}
pre.code{margin:0;padding:12px 14px;border-radius:10px;background:var(--code-bg);border:1px solid var(--border);overflow:auto;max-height:340px;white-space:pre-wrap;word-break:break-word;line-height:1.55}
.diff{border:1px solid var(--border);border-radius:10px;overflow:auto;max-height:360px;background:var(--code-bg)}
.diff div{padding:0 12px;white-space:pre-wrap;word-break:break-word;font:12.5px/1.6 "JetBrains Mono",monospace}
.diff .a{background:var(--diff-add)} .diff .d{background:var(--diff-del)}
.diff .a::before{content:"+ ";color:var(--s-idle)} .diff .d::before{content:"− ";color:var(--s-err)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-all}

/* ---------- session detail */
.sess-h{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px}
.sess-h h1{margin:0;font-size:24px;letter-spacing:-.025em;font-weight:680;line-height:1.2}
.sess-h .title{color:var(--text-2);margin-top:4px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;background:var(--surface);border:1px solid var(--border);font-size:12px;color:var(--text-2);max-width:100%}
.chip .svg{width:13px;height:13px;color:var(--muted)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-h .acts{margin-left:auto;display:flex;gap:6px}

.now{display:grid;grid-template-columns:auto 1fr;gap:20px;padding:20px;align-items:center;position:relative;overflow:hidden}
.now::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 160px at 0% 0%,color-mix(in srgb,var(--sc) 14%,transparent),transparent 70%);pointer-events:none}
.orb{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:var(--sc);background:color-mix(in srgb,var(--sc) 12%,transparent);border:1px solid color-mix(in srgb,var(--sc) 35%,transparent);position:relative}
.orb .svg{width:26px;height:26px}
.orb.live::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid transparent;border-top-color:var(--sc);animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.now .lbl{font-size:12px;font-weight:600;color:var(--sc);text-transform:uppercase;letter-spacing:.06em;display:flex;gap:10px;align-items:center}
.now .lbl .el{color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.now .detail{font-size:17px;font-weight:600;margin-top:3px;letter-spacing:-.01em;word-break:break-word}
.cur{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.cur .toolline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.bubble{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);font-size:13.5px;white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto}
.bubble .who{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.q-opt{display:block;padding:8px 12px;border:1px solid var(--border);border-radius:9px;margin-top:6px;background:var(--surface)}
.q-opt small{display:block;color:var(--muted)}

.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;margin-top:18px}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}

/* timeline */
.tl-filter{display:flex;gap:4px;margin-left:auto}
.tl-filter button{border:1px solid transparent;background:transparent;font-size:11.5px;padding:3px 8px;border-radius:6px;color:var(--muted);font-weight:500}
.tl-filter button.on{border-color:var(--border);background:var(--surface-2);color:var(--text)}
.tl{max-height:640px;overflow:auto;padding:6px 0}
.ev{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:7px 16px;position:relative}
.ev:hover{background:var(--surface-2)}
.ev .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--surface-3);color:var(--text-2)}
.ev .ic .svg{width:13px;height:13px}
.ev .ic.ok{color:var(--s-idle)} .ev .ic.bad{color:var(--s-err);background:color-mix(in srgb,var(--s-err) 12%,transparent)}
.ev .ic.prompt{color:var(--accent);background:var(--accent-soft)} .ev .ic.appr{color:var(--s-appr)} .ev .ic.sub{color:var(--s-sub)}
.ev .h{font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.ev .h .agent{font-weight:500;color:var(--s-sub);font-size:11.5px}
.ev .x{font-size:12.5px;color:var(--text-2);word-break:break-word;white-space:pre-wrap;max-height:84px;overflow:hidden}
.ev .x.mono{font-size:11.8px}
.ev .r{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .tm{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}

/* subagents */
.sa{padding:12px 16px;border-bottom:1px solid var(--border)}
.sa:last-child{border-bottom:0}
.sa .r1{display:flex;gap:8px;align-items:center}
.sa .ty{font:600 11.5px "JetBrains Mono",monospace;color:var(--s-sub);background:color-mix(in srgb,var(--s-sub) 12%,transparent);padding:1px 7px;border-radius:6px}
.sa .ds{font-weight:600;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sa .ln{font-size:12px;color:var(--text-2);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sa .mt{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.sa details{margin-top:6px} .sa summary{font-size:12px;color:var(--muted);cursor:pointer}
.sa details p{font-size:12.5px;color:var(--text-2);white-space:pre-wrap;margin:6px 0 0}
.bar-run{height:2px;border-radius:2px;margin-top:8px;background:linear-gradient(90deg,transparent,var(--s-sub),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:sweep 1.4s ease-in-out infinite}
@keyframes sweep{0%{background-position:-50% 0}100%{background-position:150% 0}}

/* todos */
.todo{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:13px}
.todo .bx{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--border-strong);flex:none;margin-top:2px;display:grid;place-items:center}
.todo.completed .bx{background:var(--s-idle);border-color:var(--s-idle);color:#fff}
.todo.completed span{color:var(--muted);text-decoration:line-through}
.todo.in_progress .bx{border-color:var(--s-run);box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 8px var(--s-run)}
.todo.in_progress span{font-weight:600}

/* usage */
.hero-num{font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.hero-sub{font-size:12px;color:var(--muted)}
.stackbar{display:flex;height:12px;border-radius:4px;overflow:hidden;gap:2px;margin:14px 0 10px;background:var(--surface)}
.stackbar i{display:block;height:100%;min-width:2px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12px}
.legend div{display:flex;align-items:center;gap:7px;color:var(--text-2)}
.legend b{margin-left:auto;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.gauge{margin-top:16px}
.gauge .gl{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-bottom:6px}
.gauge .gt{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.gauge .gt i{display:block;height:100%;border-radius:4px;background:var(--gc,var(--s-run))}
table.mini{width:100%;border-collapse:collapse;font-size:12px;margin-top:14px}
table.mini th{text-align:left;color:var(--muted);font-weight:500;padding:4px 0;border-bottom:1px solid var(--border)}
table.mini td{padding:5px 0;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
table.mini td:not(:first-child),table.mini th:not(:first-child){text-align:right}
.spark{display:flex;align-items:flex-end;gap:2px;height:54px;margin-top:14px;position:relative}
.spark i{flex:1;background:var(--c1);border-radius:2px 2px 0 0;min-height:1px;position:relative}
.spark i:hover{background:var(--accent)}
.spark-l{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:4px}
.hbar{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;font-size:12px;padding:3px 0}
.hbar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.hbar .t{height:8px;border-radius:0 4px 4px 0;background:var(--surface-3)}
.hbar .t i{display:block;height:100%;background:var(--c1);border-radius:0 4px 4px 0}
.hbar b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:7px;opacity:0;transition:opacity .1s;white-space:nowrap}

/* overview */
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ocard{padding:16px;cursor:pointer;transition:transform .12s,border-color .12s;display:flex;flex-direction:column;gap:10px;text-align:left}
.ocard:hover{transform:translateY(-1px);border-color:var(--border-strong)}
.ocard .r1{display:flex;align-items:center;gap:8px}
.ocard h3{margin:0;font-size:15px;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocard .d{font-size:12.5px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.ocard .f{display:flex;gap:12px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.hosts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.hcard{padding:14px 16px;display:flex;gap:12px;align-items:center}
.hcard .hi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface-3);color:var(--text-2)}
.hcard .hn{font-weight:650}
.hcard .hs{font-size:12px;color:var(--muted)}
.help{padding:18px 20px}
.help h3{margin:0 0 6px;font-size:15px}
.help p{margin:6px 0;color:var(--text-2);font-size:13px}
.help pre{margin:8px 0}
.welcome{text-align:center;padding:60px 20px;color:var(--text-2)}
.welcome h2{color:var(--text);letter-spacing:-.02em}
.muted{color:var(--muted)}
.toast{position:fixed;right:20px;bottom:20px;z-index:60;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);animation:slidein .2s}

/* account */
.acct-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{padding:14px 16px}
.stat .v{font-size:24px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .l{font-size:12px;color:var(--muted)}
.stat .s{font-size:12px;color:var(--text-2);margin-top:2px;font-variant-numeric:tabular-nums}
.limits{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.lim{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.lim .hd{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.lim .hd .pill{margin-left:auto}
.lim .big{font-size:34px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.lim .big small{font-size:14px;color:var(--muted);font-weight:500;letter-spacing:0}
.meter{height:10px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.meter i{display:block;height:100%;border-radius:5px;background:var(--sc)}
.lim .rs{font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.lim svg.trend{width:100%;height:48px;display:block}
.lvl-ok{--sc:var(--s-idle)} .lvl-warn{--sc:var(--s-appr)} .lvl-high{--sc:var(--s-wait)} .lvl-crit{--sc:var(--s-err)}
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:6px}
.bars i{flex:1;background:var(--c1);border-radius:3px 3px 0 0;min-height:2px}
.bars i:hover{background:var(--accent)}
.bars i.today{background:var(--accent)}
.bars-l{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:6px}
.seg2{display:inline-flex;padding:2px;background:var(--surface-3);border-radius:7px;margin-left:auto}
.seg2 button{border:0;background:transparent;font-size:11.5px;padding:3px 9px;border-radius:6px;color:var(--text-2);font-weight:500}
.seg2 button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{text-align:left;color:var(--muted);font-weight:500;padding:8px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
table.tbl td{padding:8px 16px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;white-space:nowrap}
table.tbl tr:last-child td{border-bottom:0}
table.tbl td.num,table.tbl th.num{text-align:right}
table.tbl .share{display:inline-block;width:80px;height:6px;border-radius:0 3px 3px 0;background:var(--surface-3);vertical-align:middle;margin-right:8px}
table.tbl .share i{display:block;height:100%;background:var(--c1);border-radius:0 3px 3px 0}
.tblwrap{overflow-x:auto}
.note{font-size:12px;color:var(--muted);margin-top:8px}

@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border);max-height:46vh}
  main{padding:16px}
  .top{flex-wrap:wrap;gap:10px;padding:10px 16px}
  .kpis{order:3;flex-basis:100%}
  .sess-h{flex-direction:column}
  .sess-h .acts{margin-left:0}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo"><svg class="svg" viewBox="0 0 24 24" style="stroke-width:2.2"><path d="M12 3l2 6.5L20.5 12 14 14l-2 7-2-7-6.5-2L10 9.5z"/></svg></div>Agent Cockpit
    <span class="conn" id="conn"><i></i><span>connecting</span></span></div>
  <div class="kpis" id="kpis"></div>
  <div class="tools">
    <button class="iconbtn" id="btnNotify" title="Desktop notifications for approvals"></button>
    <button class="iconbtn" id="btnSound" title="Sound on approvals"></button>
    <button class="iconbtn" id="btnTheme" title="Toggle theme"></button>
  </div>
</header>
<div class="layout">
  <aside>
    <div class="search"><svg class="svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Search sessions, hosts, paths…" autocomplete="off"></div>
    <div class="seg" id="seg"><button data-f="active" class="on">Active</button><button data-f="all">All</button><button data-f="ended">History</button></div>
    <button class="navitem" id="navOverview"></button>
    <button class="navitem" id="navAccount"></button>
    <div id="side"></div>
  </aside>
  <main id="main">
    <div class="dock" id="dock"></div>
    <div id="view"><div class="welcome"><h2>Connecting…</h2></div></div>
  </main>
</div>
<div id="tip"></div>
<script>
const TOKEN = "__COCKPIT_TOKEN__";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S = { sessions:new Map(), hosts:new Map(), approvals:new Map(), sel:null, page:"overview", filter:"active", q:"", tl:"all", connected:false, skew:0,
  account:null, limits:{}, limitHist:{}, acctMetric:"cost", acctRange:30 };
const prefs = (()=>{ try{ return JSON.parse(localStorage.getItem("cockpit")||"{}") }catch{ return {} } })();
const savePrefs = ()=>{ try{ localStorage.setItem("cockpit", JSON.stringify(prefs)) }catch{} };

/* ------------------------------------------------------------- icons */
const P = {
  terminal:'<path d="M4 17l6-5-6-5"/><path d="M12 19h8"/>', file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>', search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>', bot:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 14h.01M15 14h.01"/>',
  check:'<path d="M5 12l5 5L20 7"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>', server:'<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>',
  laptop:'<rect x="4" y="5" width="16" height="11" rx="2"/><path d="M2 19h20"/>', zap:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>', list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
  brain:'<path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a3 3 0 0 0-3-1zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', msg:'<path d="M21 12a8 8 0 0 1-12 7l-5 1 1-4a8 8 0 1 1 16-4z"/>', pause:'<circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/>',
  stop:'<circle cx="12" cy="12" r="9"/><rect x="9" y="9" width="6" height="6" rx="1"/>', alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17h.01"/>', play:'<path d="M7 4l13 8-13 8z"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>', branch:'<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 4-6 3-12 7"/>',
  cpu:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>', hash:'<path d="M5 9h14M5 15h14M10 3L8 21M16 3l-2 18"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/>', belloff:'<path d="M6 8a6 6 0 0 1 9.3-5M18 8c0 7 3 9 3 9H9M10 21a2 2 0 0 0 4 0M3 3l18 18"/>',
  vol:'<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>', mute:'<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>', moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  link:'<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>', trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  compress:'<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>', sparkle:'<path d="M12 3l2 6.5L20.5 12 14 14l-2 7-2-7-6.5-2L10 9.5z"/>',
};
const ic = (n, extra="") => `<svg class="svg" viewBox="0 0 24 24" ${extra}>${P[n]||P.zap}</svg>`;
const toolIcon = t => !t ? "zap" : t==="Bash"?"terminal": ["Read"].includes(t)?"file": ["Edit","Write","MultiEdit","NotebookEdit"].includes(t)?"edit":
  ["Grep","Glob"].includes(t)?"search": ["WebFetch","WebSearch"].includes(t)?"globe": ["Task","Agent"].includes(t)?"bot": t==="TodoWrite"?"list": t==="AskUserQuestion"?"msg": t.startsWith("mcp__")?"link":"zap";
const toolName = t => t && t.startsWith("mcp__") ? t.slice(5).replace("__"," › ") : t;

/* ------------------------------------------------------------- status */
const STATUS = {
  running:{l:"Running",i:"play",live:true}, thinking:{l:"Thinking",i:"brain",live:true}, subagents:{l:"Subagents working",i:"bot",live:true},
  awaiting_approval:{l:"Needs approval",i:"shield",live:false}, waiting_input:{l:"Waiting for you",i:"msg",live:false},
  idle:{l:"Idle",i:"check",live:false}, error:{l:"Error",i:"alert",live:false}, ended:{l:"Ended",i:"stop",live:false}, quiet:{l:"Quiet",i:"pause",live:false},
};
const now = () => Date.now()/1000 + S.skew;
function effStatus(s){
  if (s.pending && s.pending.length) return "awaiting_approval";
  if (["running","thinking","subagents"].includes(s.status) && now()-s.last_ts > 900) return "quiet";
  return s.status;
}
const isActive = s => { const st=effStatus(s); return st!=="ended" && (now()-s.last_ts < 6*3600 || st==="awaiting_approval"); };
const pill = (st, sm) => { const m=STATUS[st]||STATUS.idle; return `<span class="pill st-${st}">${ic(m.i)}${esc(m.l)}</span>`; };
const sdot = st => `<span class="sdot st-${st} ${STATUS[st]?.live||st==="awaiting_approval"?"pulse":""}"></span>`;

/* ------------------------------------------------------------- format */
const fmtN = n => { n=+n||0; return n>=1e9?(n/1e9).toFixed(2)+"B": n>=1e6?(n/1e6).toFixed(n>=1e7?1:2)+"M": n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+"k": String(n); };
function ago(t){ const d=Math.max(0,now()-t); return d<5?"now": d<60?Math.floor(d)+"s": d<3600?Math.floor(d/60)+"m": d<86400?Math.floor(d/3600)+"h": Math.floor(d/86400)+"d"; }
function dur(d){ d=Math.max(0,Math.floor(d)); if (d>=86400) return `${Math.floor(d/86400)}d ${Math.floor(d%86400/3600)}h`; const h=Math.floor(d/3600), m=Math.floor(d%3600/60), s=d%60; return h? `${h}h ${m}m` : m? `${m}m ${String(s).padStart(2,"0")}s` : `${s}s`; }
const clock = t => new Date(t*1000).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
const tot = u => (u.in||0)+(u.out||0)+(u.cr||0)+(u.cw||0);
const shortModel = m => (m||"").replace(/^claude-/,"").replace(/-\d{8}$/,"");
const homeTilde = p => (p||"").replace(/^\/(Users|home)\/[^/]+/,"~");
const hostOf = s => S.hosts.get(s.host) || {hostname:(s.host||"?").split("@")[1]||s.host, user:""};
const ctxWindow = s => /1m|\[1m\]/i.test(s.model||"") || (s.usage?.ctx||0) > 200000 ? 1000000 : 200000;

/* ------------------------------------------------------------- data */
async function api(path, opts={}){
  const r = await fetch(path, {...opts, headers:{"Content-Type":"application/json","X-Cockpit-Token":TOKEN, ...(opts.headers||{})}});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function loadState(){
  const d = await api("/api/state");
  S.skew = d.server.time - Date.now()/1000;
  S.sessions = new Map(d.sessions.map(s=>[s.id,s]));
  S.hosts = new Map(d.hosts.map(h=>[h.key,h]));
  S.approvals = new Map(d.approvals.map(a=>[a.id,a]));
  S.account = d.account; S.limits = d.limits||{}; S.limitHist = d.limit_hist||{};
  if (!S.sel && location.hash==="#account") S.page="account";
  else if (!S.sel && location.hash.length>1) S.sel = decodeURIComponent(location.hash.slice(1));
  if (S.sel && !S.sessions.has(S.sel)) S.sel = null;
  render();
}
let es;
function connect(){
  es = new EventSource("/api/stream?t="+encodeURIComponent(TOKEN));
  es.onopen = () => { S.connected = true; loadState().catch(()=>{}); renderConn(); };
  es.onerror = () => { S.connected = false; renderConn(); };
  es.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type==="session"){
      const old = S.sessions.get(m.session.id);
      const events = old?.events || [];
      if (m.event){ events.push(m.event); if (events.length>400) events.splice(0, events.length-400); }
      S.sessions.set(m.session.id, {...m.session, events});
    } else if (m.type==="host"){ S.hosts.set(m.host.key, m.host); }
    else if (m.type==="approval"){
      const isNew = !S.approvals.has(m.approval.id) && m.approval.status==="pending";
      S.approvals.set(m.approval.id, m.approval);
      if (isNew) alertApproval(m.approval);
    } else if (m.type==="account"){ S.account = m.account; }
    else if (m.type==="limits"){ S.limits[m.host] = m.limits; S.limitHist[m.host] = m.hist; }
    else if (m.type==="remove"){ S.sessions.delete(m.id); if (S.sel===m.id) S.sel=null; }
    schedule();
  };
}
let raf=0; function schedule(){ if(!raf) raf=requestAnimationFrame(()=>{raf=0;render();}); }

/* ------------------------------------------------------------- alerts */
function alertApproval(a){
  const s = S.sessions.get(a.session);
  if (prefs.sound!==false) beep();
  if (prefs.notify && "Notification" in window && Notification.permission==="granted"){
    const n = new Notification(`Approval needed · ${a.tool}`, {body:`${hostOf(s||{}).hostname||""} · ${a.project}\n${a.summary||""}`.slice(0,240), tag:a.id, requireInteraction:true});
    n.onclick = () => { window.focus(); S.sel=a.session; render(); n.close(); };
  }
}
let actx; function beep(){ try{ actx = actx || new AudioContext(); const t=actx.currentTime;
  [[880,0],[1175,.12]].forEach(([f,d])=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; o.type="sine";
  g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(.12,t+d+.02); g.gain.exponentialRampToValueAtTime(.001,t+d+.22); o.connect(g).connect(actx.destination); o.start(t+d); o.stop(t+d+.25); }); }catch{} }
function toast(msg){ const d=document.createElement("div"); d.className="toast"; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }

/* ------------------------------------------------------------- render */
let lastSig = {};
function render(){
  renderConn(); renderKpis(); renderSide(); renderDock(); renderView(); renderTools();
  const n = pendingApprovals().length;
  document.title = (n? `(${n}) ` : "") + "Agent Cockpit";
}
function renderConn(){ const c=$("#conn"); c.className="conn"+(S.connected?" on":""); c.lastElementChild.textContent = S.connected?"live":"offline"; }
const pendingApprovals = () => [...S.approvals.values()].filter(a=>a.status==="pending").sort((a,b)=>a.created-b.created);

function renderKpis(){
  const all=[...S.sessions.values()];
  const act = all.filter(s=>["running","thinking","subagents","awaiting_approval","waiting_input"].includes(effStatus(s))).length;
  const subs = all.reduce((n,s)=>n+Object.values(s.subagents||{}).filter(x=>x.status==="running").length,0);
  const day = all.filter(s=>now()-s.last_ts<86400).reduce((n,s)=>n+tot(s.usage||{}),0);
  const out = all.filter(s=>now()-s.last_ts<86400).reduce((n,s)=>n+(s.usage?.out||0),0);
  const hosts = [...S.hosts.values()].filter(h=>now()-h.last_seen<3600).length;
  const appr = pendingApprovals().length;
  const waiting = all.filter(s=>effStatus(s)==="waiting_input").length;
  const lim = primaryLimits(), rl = lim?.rate_limits || {};
  const fh = rl.five_hour?.used_percentage, sd = rl.seven_day?.used_percentage;
  const k = [
    ...(fh!=null?[[Math.round(fh)+"%","5-hour limit used", fh>=80]]:[]),
    ...(sd!=null?[[Math.round(sd)+"%","Weekly limit used", sd>=80]]:[]),
    [act,"Working now"], [appr,"Awaiting approval",appr>0], [waiting,"Waiting for input"], [subs,"Subagents running"],
    [fmtN(day),"Tokens · 24h incl. cache"], [fmtN(out),"Output · 24h"], [hosts,"Hosts active · 1h"],
  ];
  const html = k.map(([v,l,hot])=>`<div class="kpi ${hot?"hot":""}"><b>${v}</b><span>${l}</span></div>`).join("");
  if (lastSig.k!==html){ $("#kpis").innerHTML=html; lastSig.k=html; }
}

function matches(s){
  const q=S.q.trim().toLowerCase(); if(!q) return true;
  const h=hostOf(s);
  return [s.project,s.title,s.cwd,s.prompt,h.hostname,h.user,s.model,s.id,s.branch].some(x=>(x||"").toLowerCase().includes(q));
}
function visibleSessions(){
  return [...S.sessions.values()].filter(s=>{
    if(!matches(s)) return false;
    if(S.filter==="active") return isActive(s);
    if(S.filter==="ended") return !isActive(s);
    return true;

  });
}

function ruleText(sug){
  const out=[];
  for (const s of sug||[]){
    if (s.rules) for (const r of s.rules) out.push(r.ruleContent? `${r.toolName}(${r.ruleContent})` : r.toolName);
    else if (s.type==="setMode") out.push(`mode → ${s.mode}`);
    else if (s.directories) out.push(`dirs: ${s.directories.join(", ")}`);
  }
  return out;
}

function updateTimers(){
  document.querySelectorAll("[data-exp]").forEach(el=>{

    const bar = el.closest(".appr")?.querySelector("[data-bar]"); if (bar) bar.style.width = (100*left/(exp-cr))+"%";
  });
  document.querySelectorAll("[data-since]").forEach(el=>{ el.textContent = dur(now()-(+el.dataset.since)); });
  document.querySelectorAll("[data-ago]").forEach(el=>{ el.textContent = ago(+el.dataset.ago); });

}

}

const money = v => { v=+v||0; if (v===0) return "$0"; return v>=1000?"$"+(v/1000).toFixed(1)+"k": v>=100?"$"+v.toFixed(0): v>=1?"$"+v.toFixed(2): "$"+v.toFixed(3); };
function primaryLimits(){
  let best=null;
  for (const [hk,l] of Object.entries(S.limits||{})){ if (l?.rate_limits && (!best || l.ts>best.ts)) best={...l, host:hk}; }
  return best;
}
const lvl = p => p>=95?"crit": p>=80?"high": p>=50?"warn":"ok";
const lvlLabel = {ok:["Plenty left","check"], warn:["Over half used","clock"], high:["Getting close","alert"], crit:["At the limit","alert"]};
function untilTxt(ts){ if(!ts) return ""; const d=ts-now(); if (d<=0) return "resetting now";
  const when = new Date(ts*1000); const sameDay = new Date(now()*1000).toDateString()===when.toDateString();
  return `resets in <span data-until="${ts}">${dur(d)}</span> · ${sameDay? when.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}) : when.toLocaleString([], {weekday:"short",hour:"numeric",minute:"2-digit"})}`; }
function trendSvg(hist, idx, windowSec){
  const t0 = now()-windowSec; const pts = (hist||[]).filter(h=>h[0]>=t0 && h[idx]!=null);
  if (pts.length<2) return `<div class="note">Trend appears after a few minutes of activity.</div>`;
  const W=300,H=48; const xy = pts.map(h=>[ (h[0]-t0)/windowSec*W, H-2-(Math.min(100,h[idx])/100)*(H-4) ]);
  const d = xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="usage trend">
    <line x1="0" x2="${W}" y1="${H-2-0.8*(H-4)}" y2="${H-2-0.8*(H-4)}" stroke="var(--border-strong)" stroke-dasharray="3 3" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <path d="${d}" fill="none" stroke="var(--sc)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
function limitCard(title, w, hist, idx, windowSec, sub){
  if (!w || w.used_percentage==null) return "";
  const p = Math.max(0, w.used_percentage), L = lvl(p), [lab, icn] = lvlLabel[L];
  return `<div class="card lim lvl-${L}"><div class="hd">${esc(title)}<span class="pill" style="--sc:var(--sc)">${ic(icn)}${lab}</span></div>
    <div class="big">${p.toFixed(0)}%<small> used${sub?` · ${esc(sub)}`:""}</small></div>
    <div class="meter"><i style="width:${Math.min(100,p)}%"></i></div>
    <div class="rs">${untilTxt(w.resets_at)}</div>
    ${idx!=null?trendSvg(hist, idx, windowSec):""}</div>`;
}
function accountView(){
  const A = S.account || {daily:{},models:{},projects:[],hosts:{}};
  const limEntries = Object.entries(S.limits||{}).filter(([,l])=>l?.rate_limits).sort((a,b)=>b[1].ts-a[1].ts);
  // date helpers
  const dayKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const today = new Date(now()*1000);
  const sumDays = n => { let c=0,t=0,o=0,m=0; for (let i=0;i<n;i++){ const d=new Date(today.getTime()-i*864e5); const x=A.daily[dayKey(d)]; if(x){c+=x.cost;t+=x.tok;o+=x.out;m+=x.msgs;} } return {c,t,o,m}; };
  const d1=sumDays(1), d7=sumDays(7), d30=sumDays(30);
  const live = [...S.sessions.values()].filter(s=>["running","thinking","subagents","awaiting_approval","waiting_input"].includes(effStatus(s)));
  const liveCost = live.reduce((n,s)=>n+(s.cost_usd ?? s.usage?.cost ?? 0),0);
  const stat = (v,l,sub) => `<div class="card stat"><div class="v">${v}</div><div class="l">${l}</div>${sub?`<div class="s">${sub}</div>`:""}</div>`;

  // limits section
  let limHtml;
  if (limEntries.length){
    limHtml = limEntries.map(([hk,l])=>{
      const h = S.hosts.get(hk) || {hostname:hk}; const rl=l.rate_limits; const hist=S.limitHist[hk];
      const sp = rl.spend_limit;
      return `<div class="section-title" style="margin-top:${limEntries.length>1?"14px":"0"}">${ic(h.local?"laptop":"server",'style="width:13px;height:13px;vertical-align:-2px"')} ${esc(h.user?h.user+"@":"")}${esc(h.hostname)} · updated <span data-ago="${l.ts}"></span> ago</div>
        <div class="limits">
          ${limitCard("Current 5-hour session", rl.five_hour, hist, 1, 86400)}
          ${limitCard("Weekly · all models", rl.seven_day, hist, 2, 7*86400)}
          ${sp?limitCard(`Spend limit${sp.period?` · ${sp.period}`:""}`, sp, null, null, 0, sp.used_usd!=null&&sp.limit_usd!=null?`${money(sp.used_usd)} of ${money(sp.limit_usd)}`:""):""}
        </div>`;
    }).join("");
  } else {
    limHtml = `<div class="card help"><h3>${ic("clock",'style="vertical-align:-3px"')} Plan limits not reported yet</h3>
      <p>The 5-hour and weekly limits come from Claude Code's status line, which includes them for claude.ai Pro, Max and Ultra subscribers after the first response in a session.</p>
      <p>Turn on the relay once (your current status line keeps working), then send any prompt:</p>
      <pre class="code">cockpit statusline on</pre>
      <p class="muted">API-key and Bedrock/Vertex users don't have plan limits; the token and cost estimates below still apply.</p></div>`;
  }

  // daily chart
  const n = S.acctRange, metric = S.acctMetric;
  const days=[]; for (let i=n-1;i>=0;i--){ const d=new Date(today.getTime()-i*864e5); const k=dayKey(d); days.push([d,k,A.daily[k]||{cost:0,tok:0,out:0,msgs:0}]); }
  const val = x => metric==="cost"? x.cost : metric==="out"? x.out : x.tok;
  const fmtV = v => metric==="cost"? money(v) : fmtN(v)+" tok";
  const mx = Math.max(1e-9, ...days.map(d=>val(d[2])));
  const tot = days.reduce((a,d)=>a+val(d[2]),0);
  const chart = `<div class="card"><div class="card-h">${ic("zap")}Daily usage · all machines
      <div class="seg2" style="margin-left:auto">${[["cost","Est. cost"],["tok","Tokens"],["out","Output"]].map(([k,l])=>`<button data-am="${k}" class="${metric===k?"on":""}">${l}</button>`).join("")}</div>
      <div class="seg2">${[[14,"14d"],[30,"30d"],[90,"90d"]].map(([k,l])=>`<button data-ar="${k}" class="${n===k?"on":""}">${l}</button>`).join("")}</div></div>
    <div class="card-b"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-2)"><span><b style="color:var(--text);font-size:15px">${fmtV(tot)}</b> over ${n} days · avg ${fmtV(tot/n)}/day</span><span class="muted">peak ${fmtV(mx)}</span></div>
      <div class="bars">${days.map(([d,k,x],i)=>`<i class="${i===n-1?"today":""}" style="height:${Math.max(1.5,100*val(x)/mx)}%" data-tip="${d.toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"})} · ${money(x.cost)} · ${fmtN(x.tok)} tokens · ${x.msgs} responses"></i>`).join("")}</div>
      <div class="bars-l"><span>${days[0][0].toLocaleDateString([], {month:"short",day:"numeric"})}</span><span>today</span></div></div></div>`;

  // models
  const models = Object.entries(A.models||{}).sort((a,b)=>b[1].cost-a[1].cost);
  const mcost = Math.max(1e-9, ...models.map(m=>m[1].cost));
  const modelTbl = `<div class="card"><div class="card-h">${ic("cpu")}By model<span class="sub">all time</span></div><div class="tblwrap"><table class="tbl">
    <tr><th>Model</th><th class="num">Responses</th><th class="num">Input</th><th class="num">Cache read</th><th class="num">Cache write</th><th class="num">Output</th><th>Est. cost</th></tr>
    ${models.map(([m,x])=>`<tr><td>${esc(shortModel(m))}</td><td class="num">${x.msgs.toLocaleString()}</td><td class="num">${fmtN(x.in)}</td><td class="num">${fmtN(x.cr)}</td><td class="num">${fmtN(x.cw)}</td><td class="num">${fmtN(x.out)}</td><td><span class="share"><i style="width:${100*x.cost/mcost}%"></i></span>${money(x.cost)}</td></tr>`).join("") || `<tr><td colspan="7" class="muted">No usage yet</td></tr>`}
  </table></div></div>`;

  // projects
  const projs = (A.projects||[]).slice(0,15);
  const pcost = Math.max(1e-9, ...projs.map(p=>p.cost));
  const projTbl = `<div class="card"><div class="card-h">${ic("folder")}Top projects<span class="sub">by estimated cost, all time</span></div><div class="tblwrap"><table class="tbl">
    <tr><th>Project</th><th>Machine</th><th class="num">Responses</th><th class="num">Tokens</th><th>Est. cost</th><th class="num">Last active</th></tr>
    ${projs.map(p=>{ const h=S.hosts.get(p.host)||{hostname:(p.host||"").split("@")[1]||p.host}; const lt=p.last?Date.parse(p.last)/1000:0;
      return `<tr><td><b>${esc(p.project)}</b></td><td>${esc(h.hostname)}${h.ssh?' <span class="badge ssh">SSH</span>':""}</td><td class="num">${p.msgs.toLocaleString()}</td><td class="num">${fmtN(p.tok)}</td><td><span class="share"><i style="width:${100*p.cost/pcost}%"></i></span>${money(p.cost)}</td><td class="num">${lt?ago(lt)+" ago":""}</td></tr>`; }).join("") || `<tr><td colspan="6" class="muted">No usage yet</td></tr>`}
  </table></div></div>`;

  // hosts
  const hostsArr = Object.entries(A.hosts||{}).sort((a,b)=>b[1].cost-a[1].cost);
  const hostTbl = hostsArr.length>1 ? `<div class="card"><div class="card-h">${ic("server")}By machine</div><div class="tblwrap"><table class="tbl">
    <tr><th>Machine</th><th class="num">Responses</th><th class="num">Tokens</th><th class="num">Est. cost</th></tr>
    ${hostsArr.map(([hk,x])=>{ const h=S.hosts.get(hk)||{hostname:hk}; return `<tr><td>${esc(h.user?h.user+"@":"")}${esc(h.hostname)}</td><td class="num">${x.msgs.toLocaleString()}</td><td class="num">${fmtN(x.tok)}</td><td class="num">${money(x.cost)}</td></tr>`; }).join("")}
  </table></div></div>` : "";

  const since = A.first ? new Date(A.first).toLocaleDateString([], {month:"short",day:"numeric",year:"numeric"}) : "";
  return `
    <div class="sess-h"><div><h1>Account usage</h1><div class="title">Plan limits, plus token usage and API-equivalent cost across every session on every machine${since?` since ${since}`:""}.</div></div></div>
    <div class="section-title" style="margin-top:0">Plan limits</div>
    ${limHtml}
    <div class="section-title">Spend estimate</div>
    <div class="acct-top">
      ${stat(money(d1.c),"Today",`${fmtN(d1.t)} tokens · ${d1.m} responses`)}
      ${stat(money(d7.c),"Last 7 days",`${fmtN(d7.t)} tokens`)}
      ${stat(money(d30.c),"Last 30 days",`${fmtN(d30.t)} tokens`)}
      ${stat(money(A.cost),"All time",`${fmtN(A.tok)} tokens · ${(A.msgs||0).toLocaleString()} responses`)}
      ${stat(money(liveCost),"Active sessions now",`${live.length} working`)}
    </div>
    <div class="note">Costs are estimates at Anthropic API list prices (cache writes and reads priced separately). On a Pro/Max plan you aren't billed per token, so read these as API-equivalent value; your plan limits above are what actually cap you.</div>
    <div class="stack" style="margin-top:18px">${chart}${modelTbl}${projTbl}${hostTbl}</div>`;
}

function subagentRow(sa){
  const stc = sa.status==="running"?"subagents": sa.status==="done"?"idle": sa.status==="failed"?"error":"ended";
  const end = sa.ended || now();
  return `<div class="sa"><div class="r1">${sdot(stc)}<span class="ty">${esc(sa.type)}</span><span class="ds" title="${esc(sa.description)}">${esc(sa.description)}</span>
    <span class="pill st-${stc}">${esc(sa.status==="running"?(sa.background?"background":"running"):sa.status)}</span></div>
    ${sa.status==="running"?`<div class="ln">${sa.last_tool?`${esc(toolName(sa.last_tool))} · `:""}${esc(sa.last_detail||"")}</div>`:""}
    <div class="mt"><span>${sa.status==="running"?`<span data-since="${sa.started}"></span>`:dur(end-sa.started)}</span><span>${sa.tools||0} tool calls</span>${sa.tokens?`<span>${fmtN(sa.tokens)} tokens</span>`:""}${sa.model?`<span>${esc(sa.model)}</span>`:""}</div>
    ${sa.status==="running"?`<div class="bar-run"></div>`:""}
    <details data-k="sa-${esc(sa.key)}"><summary>Task brief${sa.result?" & result":""}</summary><p>${esc(sa.prompt)}</p>${sa.result?`<p style="border-top:1px solid var(--border);padding-top:6px"><b>Result:</b> ${esc(sa.result)}</p>`:""}</details>
  </div>`;
}

function timeline(s){
  let evs = (s.events||[]).slice().reverse();
  const f=S.tl;
  if (f==="tools") evs = evs.filter(e=>e.kind==="PostToolUse"||e.kind==="PostToolUseFailure"||e.kind==="PreToolUse");
  if (f==="prompts") evs = evs.filter(e=>e.kind==="UserPromptSubmit"||e.kind==="Stop");
  if (f==="errors") evs = evs.filter(e=>e.ok===false);
  // hide PreToolUse rows that already have a matching Post
  const done = new Set(evs.filter(e=>e.kind.startsWith("PostToolUse")).map(e=>e.id));
  evs = evs.filter(e=>!(e.kind==="PreToolUse" && e.id && done.has(e.id)));
  if (!evs.length) return `<div class="card-b muted">${s.source==="scan"?"This session was found in transcript history — live activity appears once it runs with the hooks installed.":"No events yet."}</div>`;
  const subs = s.subagents||{};
  return evs.slice(0,250).map(e=>{
    let icn="zap", cls="", head=esc(e.kind), x=esc(e.text||""), mono=false, r="";
    const agent = e.agent && subs[e.agent] ? `<span class="agent">↳ ${esc(subs[e.agent].type)}</span>` : "";
    switch(e.kind){
      case "UserPromptSubmit": icn="user"; cls="prompt"; head="You"; break;
      case "Stop": icn="sparkle"; cls="ok"; head="Claude finished the turn"; break;
      case "StopFailure": icn="alert"; cls="bad"; head="Turn failed"; break;
      case "PreToolUse": icn=toolIcon(e.tool); head=`${esc(toolName(e.tool))} <span class="muted" style="font-weight:500">running…</span>`; mono=true; break;
      case "PostToolUse": case "PostToolUseFailure": icn=e.ok===false?"x":toolIcon(e.tool); cls=e.ok===false?"bad":"ok"; head=esc(toolName(e.tool)) + (e.dur?` <span class="muted" style="font-weight:500">${dur(e.dur)}</span>`:""); mono=["Bash","Read","Edit","Write","Grep","Glob"].includes(e.tool); r=e.result||""; break;
      case "PermissionRequest": icn="shield"; cls="appr"; head=`Approval requested · ${esc(toolName(e.tool))}`; mono=true; break;
      case "Decision": icn=e.ok?"check":"x"; cls=e.ok?"ok":"bad"; head=esc(e.text); x=esc(toolName(e.tool)); break;
      case "SubagentStart": icn="bot"; cls="sub"; head="Subagent started"; break;
      case "SubagentStop": icn="bot"; cls="sub"; head="Subagent finished"; break;
      case "Notification": icn="bell"; cls="appr"; head="Notification"; break;
      case "SessionStart": icn="play"; head="Session started"; break;
      case "SessionEnd": icn="stop"; head="Session ended"; break;
      case "PreCompact": icn="compress"; head="Compacting context"; break;
    }
    return `<div class="ev"><div class="ic ${cls}">${ic(icn)}</div><div style="min-width:0"><div class="h">${head}${agent}</div>
      ${x?`<div class="x ${mono?"mono":""}">${x}</div>`:""}${r?`<div class="r" title="${esc(r)}">→ ${esc(r)}</div>`:""}</div><div class="tm">${clock(e.t)}</div></div>`;
  }).join("");
}

function usageCard(s,u){
  const total = tot(u);
  const parts = [["Cache read",u.cr,"--c1"],["Cache write",u.cw,"--c2"],["Input",u.in,"--c3"],["Output",u.out,"--c4"]];
  const win = s.ctx_size || ctxWindow(s), pct = s.ctx_pct!=null ? Math.min(100, s.ctx_pct) : Math.min(100, 100*(u.ctx||0)/win);
  const gc = pct>85?"var(--s-err)":pct>65?"var(--s-appr)":"var(--s-run)";
  const models = Object.entries(u.by_model||{}).sort((a,b)=>tot(b[1])-tot(a[1]));
  // last 24 hours, hourly buckets (UTC keys from transcript timestamps)
  const hb = u.hourly||{}; const bars=[]; const nowD=new Date(now()*1000);
  for (let i=23;i>=0;i--){ const d=new Date(nowD.getTime()-i*3600e3); const k=d.toISOString().slice(0,13); bars.push([d,hb[k]||0]); }
  const mx = Math.max(1,...bars.map(b=>b[1]));
  const cacheHit = (u.cr||0)/Math.max(1,(u.cr||0)+(u.cw||0)+(u.in||0));
  return `<div class="card"><div class="card-h">${ic("zap")}Token usage<span class="sub">${u.msgs||0} API responses</span></div><div class="card-b">
    <div class="hero-num">${fmtN(total)}${u.cost?` <span style="font-size:15px;color:var(--muted);font-weight:600">≈ ${money(s.cost_usd ?? u.cost)}</span>`:""}</div><div class="hero-sub">total tokens · ${fmtN(u.out)} generated · ${(cacheHit*100).toFixed(0)}% of input served from cache${u.side?` · ${fmtN(u.side)} by subagents`:""}</div>
    <div class="stackbar" role="img" aria-label="Token mix">${parts.filter(p=>p[1]>0).map(p=>`<i style="flex:${p[1]};background:var(${p[2]})" data-tip="${p[0]}: ${(+p[1]).toLocaleString()} tokens (${(100*p[1]/Math.max(1,total)).toFixed(1)}%)"></i>`).join("")}</div>
    <div class="legend">${parts.map(p=>`<div><span class="sw" style="background:var(${p[2]})"></span>${p[0]}<b>${fmtN(p[1])}</b></div>`).join("")}</div>
    <div class="gauge" style="--gc:${gc}"><div class="gl"><span>Context window</span><span><b>${fmtN(u.ctx||0)}</b> / ${fmtN(win)} · ${pct.toFixed(0)}%</span></div><div class="gt"><i style="width:${pct}%"></i></div></div>
    <div style="margin-top:16px;font-size:12px;color:var(--text-2);display:flex;justify-content:space-between"><span>Tokens per hour · last 24h</span><span class="muted">peak ${fmtN(mx)}</span></div>
    <div class="spark">${bars.map(([d,v])=>`<i style="height:${Math.max(2,100*v/mx)}%" data-tip="${d.toLocaleTimeString([], {hour:"2-digit"})} · ${v.toLocaleString()} tokens"></i>`).join("")}</div>
    <div class="spark-l"><span>24h ago</span><span>12h</span><span>now</span></div>
    ${models.length?`<table class="mini"><tr><th>Model</th><th>Calls</th><th>Output</th><th>Total</th></tr>${models.map(([m,x])=>`<tr><td>${esc(shortModel(m))}</td><td>${x.msgs}</td><td>${fmtN(x.out)}</td><td>${fmtN(tot(x))}</td></tr>`).join("")}</table>`:""}
  </div></div>`;
}
function toolMix(s){
  const e = Object.entries(s.tool_counts||{}).sort((a,b)=>b[1]-a[1]).slice(0,10);
  if (!e.length) return "";
  const mx = e[0][1];
  return `<div class="card"><div class="card-h">${ic("terminal")}Tool calls<span class="sub">${s.tools_total} total · ${s.errors||0} failed</span></div><div class="card-b">
    ${e.map(([n,v])=>`<div class="hbar"><span class="n" title="${esc(n)}">${esc(toolName(n))}</span><span class="t"><i style="width:${100*v/mx}%"></i></span><b>${v}</b></div>`).join("")}</div></div>`;
}

function renderTools(){
  const th = prefs.theme || "auto";
  $("#btnTheme").innerHTML = ic(th==="light"?"sun":th==="dark"?"moon":"sun"); $("#btnTheme").title = `Theme: ${th}`;
  $("#btnSound").innerHTML = ic(prefs.sound===false?"mute":"vol"); $("#btnSound").classList.toggle("on", prefs.sound!==false);
  $("#btnNotify").innerHTML = ic(prefs.notify?"bell":"belloff"); $("#btnNotify").classList.toggle("on", !!prefs.notify);
}
function applyTheme(){ const t=prefs.theme; if (t==="light"||t==="dark") document.documentElement.dataset.theme=t; else delete document.documentElement.dataset.theme; }

/* ------------------------------------------------------------- events */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-sel],[data-dec],[data-tl],[data-copy],[data-dismiss],[data-am],[data-ar],#navOverview,#navAccount,#seg button,#btnTheme,#btnSound,#btnNotify");
  if (!t) return;
  if (t.dataset.sel){ e.preventDefault(); S.sel=t.dataset.sel; history.replaceState(null,"","#"+encodeURIComponent(S.sel)); render(); window.scrollTo({top:0}); return; }
  if (t.dataset.dec) return decide(t.dataset.aid, t.dataset.dec);
  if (t.dataset.tl){ S.tl=t.dataset.tl; render(); return; }
  if (t.dataset.copy){ const s=S.sessions.get(t.dataset.copy); const cmd=`cd ${JSON.stringify(s.cwd)} && claude --resume ${s.id}`; navigator.clipboard?.writeText(cmd).then(()=>toast("Copied: "+cmd)).catch(()=>toast(cmd)); return; }
  if (t.dataset.dismiss){ api(`/api/session/${t.dataset.dismiss}/dismiss`,{method:"POST"}).then(()=>{S.sessions.delete(t.dataset.dismiss); S.sel=null; render();}); return; }
  if (t.id==="navOverview"){ S.sel=null; S.page="overview"; history.replaceState(null,"","#"); render(); return; }
  if (t.id==="navAccount"){ S.sel=null; S.page="account"; history.replaceState(null,"","#account"); render(); window.scrollTo({top:0}); return; }
  if (t.dataset.am){ S.acctMetric=t.dataset.am; render(); return; }
  if (t.dataset.ar){ S.acctRange=+t.dataset.ar; render(); return; }
  if (t.parentElement?.id==="seg"){ S.filter=t.dataset.f; document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b===t)); render(); return; }
  if (t.id==="btnTheme"){ const order=["auto","dark","light"]; prefs.theme=order[(order.indexOf(prefs.theme||"auto")+1)%3]; savePrefs(); applyTheme(); renderTools(); toast("Theme: "+prefs.theme); return; }
  if (t.id==="btnSound"){ prefs.sound = prefs.sound===false; savePrefs(); renderTools(); if (prefs.sound) beep(); return; }
  if (t.id==="btnNotify"){
    if (!("Notification" in window)) return toast("Notifications not supported");
    if (prefs.notify){ prefs.notify=false; savePrefs(); renderTools(); return; }
    Notification.requestPermission().then(p=>{ prefs.notify = p==="granted"; savePrefs(); renderTools(); toast(p==="granted"?"Desktop notifications on":"Notifications blocked by browser"); });
  }
});
$("#q").addEventListener("input", e=>{ S.q=e.target.value; render(); });
document.addEventListener("keydown", e=>{
  if (e.target.matches("input,textarea")) return;
  const a = pendingApprovals()[0];
  if (a && (e.key==="a"||e.key==="A")) { decide(a.id, e.shiftKey && a.suggestions?.length ? "always" : "allow"); }
  else if (a && e.key==="d") decide(a.id, "deny");
  else if (e.key==="j"||e.key==="k"){ const l=visibleSessions(); if(!l.length) return; let i=l.findIndex(s=>s.id===S.sel); i = e.key==="j"? Math.min(l.length-1,i+1) : Math.max(0,i-1); S.sel=l[i].id; render(); }
  else if (e.key==="Escape"){ S.sel=null; S.page="overview"; render(); }
  else if (e.key==="/"){ e.preventDefault(); $("#q").focus(); }
});
const tip=$("#tip");
document.addEventListener("mouseover", e=>{ const t=e.target.closest("[data-tip]"); if(!t){tip.style.opacity=0;return;} tip.textContent=t.dataset.tip; tip.style.opacity=1; });
document.addEventListener("mousemove", e=>{ tip.style.left=Math.min(innerWidth-tip.offsetWidth-8, e.clientX+12)+"px"; tip.style.top=(e.clientY-34)+"px"; });

applyTheme(); renderTools();
setInterval(()=>{ updateTimers(); renderKpis(); }, 1000);
setInterval(()=>{ lastSig.side=""; renderSide(); }, 15000);
connect();
</script>
</body>
